/* ---------- 認識乘法 ---------- */
function learnQ(){
  const hi = (game && game.qi<3) ? 5 : 9;
  let a,b,guard=0;
  do{ a=2+rnd(hi-1); b=2+rnd(hi-1); guard++; }
  while(guard<30 && game && game.cur && a===game.cur.a && b===game.cur.b);
  return {a, b, emo:LEARN_EMO[rnd(LEARN_EMO.length)]};
}
function startLearn(){
  endGame();
  lastSetup={mode:'learn'};
  game={mode:'learn', qi:0, total:LEARN_N, first:0, combo:0, maxCombo:0,
        cur:null, pick:[], miss:0, hinted:false, locked:false, t:null};
  game.cur=learnQ();
  go('learn');
}
function lnote(msg){ const el=document.getElementById('lnote'); if(el) el.textContent=msg; }
function lfb(html){ const el=document.getElementById('lfb'); if(el) el.innerHTML=html; }
function learnNext(){
  if(!game || game.mode!=='learn') return;
  if(game.qi>=game.total) return finishLearn();
  game.cur=learnQ(); game.pick=[]; game.miss=0; game.hinted=false; game.locked=false;
  go('learn');
}
function learnSlot(i){
  const g=game; if(!g || g.mode!=='learn' || g.locked) return;
  g.pick=g.pick.slice(0,+i); sfx.tap(); go('learn');
}
function learnKey(k){
  const g=game; if(!g || g.mode!=='learn' || g.locked) return;
  sfx.tap();
  if(k==='del'){ if(g.pick.length) g.pick.pop(); go('learn'); return; }
  if(g.pick.length>=2) return;
  g.pick.push(+k);
  if(g.pick.length<2){ go('learn'); return; }
  learnCheck();
}
function learnHint(){
  const g=game; if(!g || g.mode!=='learn' || g.locked) return;
  const again=g.hinted;
  g.hinted=true; sfx.tap();
  go('learn');
  lnote(again ? `有 ${g.cur.a} 排，每排 ${g.cur.b} 個` : '左邊的號碼就是第幾排，一排一排數數看');
}
function learnCheck(){
  const g=game, q=g.cur, x=g.pick[0], y=g.pick[1], p=q.a*q.b, d=ensureDaily();
  /* 照課本的寫法：排數 × 每排幾個，所以 3 排每排 5 個只有 3 × 5 算對 */
  if(x===q.a && y===q.b){
    g.locked=true;
    const clean = g.miss===0 && !g.hinted;
    if(clean){
      record(q.a,q.b,true);
      g.first++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);
      d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,g.combo);
    }
    g.qi++;
    go('learn');
    const ch=chant(x,y);
    lnote(PRAISE[rnd(PRAISE.length)]);
    lfb(`<div class="chant">${ch}${canSpeak?`<button class="say" data-act="say" data-arg="${ch}" aria-label="再唸一次">🔊</button>`:''}</div>`);
    sfx.right(g.combo);
    /* 數字唸國字，語速和口訣、翻翻樂一致 */
    say(`${zhNum(x)}、${zhNum(y)}、${zhNum(p)}`);
    save(); checkQuests();
    g.t=setTimeout(()=>{ if(game && game.mode==='learn') learnNext(); }, reduceMotion?600:2200);
  } else {
    const swapped = x===q.b && y===q.a;      /* 答案對、順序反了 */
    if(g.miss===0 && !swapped) record(q.a,q.b,false);
    g.miss++; g.combo=0;
    if(g.miss>=2) g.hinted=true;
    g.pick=[];
    go('learn');
    const box=document.getElementById('lbox');
    if(box){ box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad'); }
    lnote(swapped ? `${x} × ${y} 是「${x} 排、每排 ${y} 個」喔，這裡是 ${q.a} 排，要寫 ${q.a} × ${q.b}`
      : g.miss===1 ? `${x} × ${y} = ${x*y}，再數一次有幾排、每排幾個`
      : `提示：有 ${q.a} 排，每排 ${q.b} 個`);
    sfx.wrong();
  }
}
function finishLearn(){
  const d=ensureDaily(), m=me(), g=game;
  const score=g.first, total=g.total, acc=score/total;
  const stars=acc>=.9?3:acc>=.7?2:1;
  m.stars+=stars;
  d.p.rounds++; d.p.learns++;
  if(score===total) d.p.perfect=1;
  markPlayed();
  g.result={learn:true, slabel:'一次就答對', score, total, stars, maxCombo:g.maxCombo, newBest:false};
  save(); checkQuests();
  go('result');
}

/* ---------- 配對消消樂 ---------- */
let pairLvId='e', pairStyle='same';
function pairLv(){ return PAIR_BY[pairLvId] || PAIR_LV[0]; }
function pairExprs(p, lo, hi){
  const out=[];
  for(let a=lo;a<=hi;a++){ if(p%a===0){ const b=p/a; if(b>=lo && b<=hi) out.push([a,b]); } }
  return out;
}
function pairProducts(lo, hi, min){
  const seen={}, out=[];
  for(let a=lo;a<=hi;a++) for(let b=lo;b<=hi;b++){
    const p=a*b;
    if(!seen[p]){ seen[p]=1; if(pairExprs(p,lo,hi).length>=min) out.push(p); }
  }
  return out;
}
/* 有兩種以上「不同寫法」的答案（16 = 4x4 = 8x2），這種最能看出乘法的規律 */
function pairRich(p, lo, hi){
  const seen={}; let k=0;
  pairExprs(p,lo,hi).forEach(e=>{ const x=Math.min(e[0],e[1])+'x'+Math.max(e[0],e[1]); if(!seen[x]){ seen[x]=1; k++; } });
  return k>=2;
}
/* 一半挑這種答案，一半挑交換律（3x4 / 4x3），兩種規律都能練到 */
function pairPool(lo, hi, n){
  const all=pairProducts(lo,hi,2);
  const rich=shuffle(all.filter(p=>pairRich(p,lo,hi)));
  const plain=shuffle(all.filter(p=>!pairRich(p,lo,hi)));
  const want=Math.min(rich.length, Math.ceil(n/2));
  return shuffle(rich.slice(0,want).concat(plain, rich.slice(want)).slice(0,n));
}
/* 同一個答案挑兩個「不同寫法」的算式，優先挑 4x4 / 8x2 這種，沒有才用 3x4 / 4x3 */
function twoExprs(p, lo, hi){
  const ex=shuffle(pairExprs(p,lo,hi)), uniq=[], seen={};
  ex.forEach(e=>{ const k=Math.min(e[0],e[1])+'x'+Math.max(e[0],e[1]); if(!seen[k]){ seen[k]=1; uniq.push(e); } });
  return uniq.length>=2 ? [uniq[0],uniq[1]] : ex.slice(0,2);
}
function pairDeck(lv){
  const lo=2, hi=lv.hi, out=[];
  pairPool(lo,hi,lv.pairs).forEach((p,i)=>{
    const two=twoExprs(p,lo,hi);
    out.push({a:two[0][0], b:two[0][1], p, g:i, ok:false, tried:false, bad:false},
             {a:two[1][0], b:two[1][1], p, g:i, ok:false, tried:false, bad:false});
  });
  return shuffle(out);
}
/* 找不同：每張卡有兩個算式，只有一張的兩邊答案不一樣 */
function diffRound(lv){
  const lo=2, hi=lv.hi, n=Math.max(2,lv.cards);
  const ps=pairPool(lo,hi,n);
  const cards=[];
  for(let i=0;i<n-1;i++){
    const p=ps[i%ps.length], two=twoExprs(p,lo,hi);
    cards.push({l:two[0], r:two[1], bad:false, tried:false, found:false});
  }
  const p=ps[(n-1)%ps.length], ex=shuffle(pairExprs(p,lo,hi)), l=ex[0];
  let r=null, guard=0;
  while(!r && guard++<60){
    const base=ex[ex.length>1?1:0];
    const d=rnd(2)?1:-1, w=rnd(2);
    const a=w?base[0]+d:base[0], b=w?base[1]:base[1]+d;
    if(a>=lo && a<=hi && b>=lo && b<=hi && a*b!==p) r=[a,b];
  }
  if(!r){ let a,b; do{ a=lo+rnd(hi-lo+1); b=lo+rnd(hi-lo+1); }while(a*b===p); r=[a,b]; }
  cards.push({l, r, bad:true, tried:false, found:false});
  return shuffle(cards);
}
function startPair(style, lvId){
  endGame();
  if(style) pairStyle = style==='diff' ? 'diff' : 'same';
  if(lvId && PAIR_BY[lvId]) pairLvId=lvId;
  const lv=pairLv();
  lastSetup={mode:'pair', style:pairStyle, lv:pairLvId};
  game = pairStyle==='same'
    ? {mode:'pair', style:'same', lv:lv.id, cards:pairDeck(lv), sel:-1, done:0, total:lv.pairs,
       first:0, combo:0, maxCombo:0, locked:false, t:null}
    : {mode:'pair', style:'diff', lv:lv.id, cards:diffRound(lv), qi:0, total:lv.rounds, miss:0,
       first:0, combo:0, maxCombo:0, locked:false, t:null};
  go('pair');
}
function pnote(msg){ const el=document.getElementById('pnote'); if(el) el.textContent=msg; }
function pairClear(){
  const g=game; if(!g || g.mode!=='pair') return;
  g.cards.forEach(c=>{ c.bad=false; });
  if(g.style==='same') g.sel=-1;
}
function pairTap(i){
  const g=game; if(!g || g.mode!=='pair' || g.locked) return;
  if(g.style==='diff') return diffTap(i);
  const c=g.cards[i]; if(!c || c.ok) return;
  g.cards.forEach(x=>{ x.bad=false; });
  if(g.sel===i){ g.sel=-1; sfx.tap(); go('pair'); return; }
  if(g.sel<0){
    g.sel=i; sfx.tap(); go('pair');
    pnote(`${c.a} × ${c.b} 是多少？再找一張答案一樣的`);
    return;
  }
  const f=g.cards[g.sel], d=ensureDaily();
  if(f.g===c.g){
    const clean = !f.tried && !c.tried;
    if(clean){
      record(f.a,f.b,true); record(c.a,c.b,true);
      g.first++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);
      d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,g.combo);
    }
    f.ok=c.ok=true; g.sel=-1; g.done++;
    const full=g.done>=g.total;
    if(full) g.locked=true;
    go('pair');
    pnote(`${f.a} × ${f.b} 和 ${c.a} × ${c.b} 都是 ${c.p}！`);
    sfx.right(g.combo);
    say(chant(f.a,f.b)+'，'+chant(c.a,c.b));
    const el=document.querySelector(`.pcard[data-arg="${i}"]`); if(el) burstAt(el, clean?14:8);
    save(); checkQuests();
    if(full) g.t=setTimeout(()=>{ if(game && game.mode==='pair') finishPair(); }, reduceMotion?400:1500);
  } else {
    f.tried=c.tried=true; f.bad=c.bad=true; g.combo=0; g.sel=-1;
    record(c.a,c.b,false);
    go('pair');
    pnote(`${f.a} × ${f.b} = ${f.p}，${c.a} × ${c.b} = ${c.p}，不一樣喔`);
    sfx.wrong();
    g.t=setTimeout(()=>{
      if(game && game.mode==='pair' && !game.locked){ pairClear(); go('pair'); pnote('再找找看，哪兩張的答案一樣？'); }
    }, 1200);
  }
}
function diffTap(i){
  const g=game; if(!g || g.mode!=='pair' || g.style!=='diff' || g.locked) return;
  const c=g.cards[i]; if(!c || c.found) return;
  const lp=c.l[0]*c.l[1], rp=c.r[0]*c.r[1], d=ensureDaily();
  if(c.bad){
    const clean = g.miss===0;
    if(clean){
      record(c.l[0],c.l[1],true); record(c.r[0],c.r[1],true);
      g.first++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);
      d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,g.combo);
    }
    c.found=true; g.locked=true; g.qi++;
    go('pair');
    pnote(`答對了！${c.l[0]} × ${c.l[1]} = ${lp}，但 ${c.r[0]} × ${c.r[1]} = ${rp}`);
    sfx.right(g.combo);
    say(chant(c.l[0],c.l[1])+'，'+chant(c.r[0],c.r[1]));
    save(); checkQuests();
    g.t=setTimeout(()=>{ if(game && game.mode==='pair') diffNext(); }, reduceMotion?500:1900);
  } else {
    if(g.miss===0) record(c.l[0],c.l[1],false);
    g.miss++; g.combo=0; c.tried=true;
    go('pair');
    pnote(`${c.l[0]} × ${c.l[1]} 和 ${c.r[0]} × ${c.r[1]} 都是 ${lp}，這兩個一樣喔`);
    sfx.wrong();
  }
}
function diffNext(){
  const g=game; if(!g || g.mode!=='pair' || g.style!=='diff') return;
  if(g.qi>=g.total) return finishPair();
  g.cards=diffRound(pairLv()); g.miss=0; g.locked=false;
  go('pair');
}
function finishPair(){
  const d=ensureDaily(), m=me(), g=game;
  const score=g.first, total=g.total, acc=score/total;
  const stars=acc>=.9?3:acc>=.7?2:1;
  m.stars+=stars;
  d.p.rounds++; d.p.pairs++;
  if(score===total) d.p.perfect=1;
  markPlayed();
  g.result={pair:true, style:g.style, slabel:g.style==='same'?'一次就配對成功':'一次就找到',
    score, total, stars, maxCombo:g.maxCombo, newBest:false};
  save(); checkQuests();
  go('result');
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act=el.dataset.act, arg=el.dataset.arg;
  unlockAudio();
  switch(act){
    case 'home':
      if(inGame()){ askQuit(); break; }
      closeModal(); endGame(); go('home'); break;
    case 'reviewPick': pickFor='review'; go('pick'); break;
    case 'huntPick': pickFor='hunt'; go('pick'); break;
    case 'snakePick': go('snakePick'); break;
    case 'learn': startLearn(); break;
    case 'lkey': learnKey(arg); break;
    case 'lslot': learnSlot(arg); break;
    case 'lhint': learnHint(); break;
    case 'pairPick': go('pairPick'); break;
    case 'pstyle': pairStyle = arg==='diff'?'diff':'same'; sfx.tap(); go('pairPick'); break;
    case 'plv': if(PAIR_BY[arg]) pairLvId=arg; sfx.tap(); go('pairPick'); break;
    case 'pstart': startPair(pairStyle, pairLvId); break;
    case 'ptap': pairTap(+arg); break;
    case 'snlv': snakeLvId=arg; sfx.tap(); go('snakePick'); break;
    case 'snstart': startSnake(arg==='mix'?0:+arg, snakeLvId); break;
    case 'sdir': snakeDir(arg); break;
    case 'spause': snakePause(); break;
    case 'padon': state.settings.pad=true; save(); go('snake'); break;
    case 'padoff': state.settings.pad=false; save(); go('snake'); break;
    case 'hfind': huntPick(+arg, el); break;
    case 'hhint': huntHint(); break;
    case 'gallery': closeModal(); endGame(); go('gallery'); break;
    case 'art': showArt(+arg); break;
    case 'flip': flipCard(+arg); break;
    case 'flipall': flipAll(true); break;
    case 'flipnone': flipAll(false); break;
    case 'auto': startAuto(); break;
    case 'input': state.settings.input=arg; save(); sfx.tap(); go(currentView); break;
    case 'start':
      if(pickFor==='hunt') startHunt(+arg); else startReview(+arg);
      break;
    case 'timed': startTimed(); break;
    case 'stages': go('stages'); break;
    case 'stage': startStage(+arg); break;
    case 'book': go('book'); break;
    case 'claim': claimQuest(arg); break;
    case 'bonus': claimBonus(arg); break;
    case 'tier': uiTier=arg; sfx.tap(); go('home'); break;
    case 'players': closeModal(); if(inGame()){ askQuit(); break; } endGame(); go('players'); break;
    case 'addForm': go('addPlayer'); break;
    case 'ava': formAvatar=arg; document.querySelectorAll('.ava-opt').forEach(b=>b.classList.toggle('on', b.dataset.arg===arg)); sfx.tap(); break;
    case 'createPlayer': {
      const n=readName();
      if(!n){ toast('先輸入名字喔 ✏️'); focusName(); break; }
      addPlayer(n, formAvatar); updateTop(); go('home');
      toast(`${formAvatar} ${n}，開始冒險吧！`); sfx.fanfare();
      if(!state.settings.helped){ state.settings.helped=true; save(); setTimeout(showHelp, 900); }
      break;
    }
    case 'use': usePlayer(arg); break;
    case 'rename': askRename(arg); break;
    case 'renameOk': {
      const p=state.players.find(x=>x.id===arg), n=readName();
      if(!p) { closeModal(); break; }
      if(!n){ toast('名字不能空白喔'); focusName(); break; }
      p.name=n; p.avatar=AVA_SET.has(formAvatar)?formAvatar:p.avatar; save(); closeModal(); updateTop(); go('players');
      break;
    }
    case 'delp': askDelete(arg); break;
    case 'delYes': removePlayer(arg); closeModal(); updateTop(); go(hasPlayer()?'players':'home'); toast('已經刪除了'); break;
    case 'key': pressKey(arg); break;
    case 'choice': submit(+arg); break;
    case 'next': advance(); break;
    case 'say': say(arg); break;
    case 'quit': askQuit(); break;
    case 'quitYes': closeModal(); endGame(); go('home'); break;
    case 'closeModal': closeModal(); break;
    case 'closeBook': closeModal(); go('book'); break;
    case 'again': if(lastSetup){
        lastSetup.mode==='timed' ? startTimed()
        : lastSetup.mode==='hunt' ? startHunt(lastSetup.table)
        : lastSetup.mode==='snake' ? startSnake(lastSetup.table, lastSetup.lv)
        : lastSetup.mode==='learn' ? startLearn()
        : lastSetup.mode==='pair' ? startPair(lastSetup.style, lastSetup.lv)
        : startStage(lastSetup.stage);
      } break;
    case 'draw': draw(); break;
    case 'peek': { const s=STICKERS.find(x=>x.id===arg); if(s) showReveal(s,false); break; }
    case 'mute': state.settings.muted=!state.settings.muted; save(); updateTop(); break;
    case 'help': showHelp(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.target && e.target.id==='nameInput'){
    if(e.key==='Enter'){
      const b=document.querySelector('[data-act="renameOk"]') || document.querySelector('[data-act="createPlayer"]');
      if(b){ e.preventDefault(); b.click(); }
    }
    return;
  }
  if(e.key==='Escape' && document.getElementById('modal')){ closeModal(); return; }
  if(currentView==='snake' && game && !document.getElementById('modal')){
    unlockAudio();
    const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'}[e.key];
    if(k){ snakeDir(k); e.preventDefault(); }
    else if(e.key===' '){ snakePause(); e.preventDefault(); }
    return;
  }
  if(currentView==='learn' && game && !document.getElementById('modal')){
    unlockAudio();
    if(/^[1-9]$/.test(e.key)){ learnKey(e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ learnKey('del'); e.preventDefault(); }
    return;
  }
  if(currentView!=='play' || !game || document.getElementById('modal')) return;
  unlockAudio();
  if(game.input==='type' || game.waiting){
    if(/^[0-9]$/.test(e.key)){ pressKey(e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ pressKey('del'); e.preventDefault(); }
    else if(e.key==='Enter'){ if(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.act==='next'){ e.preventDefault(); } pressKey('ok'); e.preventDefault(); }
  }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });

ensureDaily();
updateTop();
go('home');
initCloud();
</script>
