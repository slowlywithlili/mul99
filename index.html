<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="img-src 'self' data:; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>九九乘法大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D7EDFF; --dot:#C2E2FF; --surface:#FFFFFF; --surface2:#EEF7FF; --ink:#1C2A4A; --muted:#55678B;
  --edge:#1C2A4A; --drop:#1C2A4A; --track:#D3E4F7;
  --sun:#FFC83D; --tomato:#FF5C5C; --mint:#25C686; --grape:#7B61FF; --sky:#3FA3FF; --peach:#FF9E6B;
  --on-color:#1C2A4A;
  --zh:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --num:'Fredoka','Huninn','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A33; --dot:#16264A; --surface:#1A2948; --surface2:#23365C; --ink:#EEF4FF; --muted:#A9B9DA;
    --edge:#6A84C2; --drop:#050A18; --track:#2A3D66; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A33; --dot:#16264A; --surface:#1A2948; --surface2:#23365C; --ink:#EEF4FF; --muted:#A9B9DA;
  --edge:#6A84C2; --drop:#050A18; --track:#2A3D66; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  margin:0;min-height:100%;color:var(--ink);font-family:var(--zh);font-size:17px;line-height:1.5;
  background:var(--bg);
  background-image:radial-gradient(var(--dot) 2.2px,transparent 2.8px);background-size:24px 24px;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px;border-radius:12px}
h1,h2,h3,p{margin:0}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:3px solid var(--edge)}
.topbar .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}
.logo{background:none;border:0;padding:4px 2px;cursor:pointer;font-weight:700;font-size:19px;display:flex;align-items:center;gap:6px}
.logo .mini{font-family:var(--num);font-weight:700;background:var(--sun);color:var(--on-color);border:2px solid var(--edge);border-radius:9px;padding:0 6px;font-size:16px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:2px solid var(--edge);border-radius:999px;padding:2px 11px;font-family:var(--num);font-weight:600;font-size:17px}
.iconbtn{background:var(--surface2);border:2px solid var(--edge);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:17px;display:grid;place-items:center;flex:none}

main{max-width:620px;margin:0 auto;padding:18px 14px 48px}
.card{background:var(--surface);border:3px solid var(--edge);border-radius:22px;box-shadow:0 5px 0 var(--drop);padding:16px}
.btn{font-weight:700;border:3px solid var(--edge);border-radius:16px;padding:11px 18px;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--drop);cursor:pointer;transition:transform .08s,box-shadow .08s;font-size:17px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.btn.sun{background:var(--sun);color:var(--on-color)}
.btn.mint{background:var(--mint);color:#06281A}
.btn.small{padding:6px 12px;font-size:15px;border-radius:12px;box-shadow:0 3px 0 var(--drop)}
.btn.big{font-size:20px;padding:14px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.backrow h2{font-size:24px}

/* home hero */
.hero{text-align:center;padding:6px 0 18px}
.tiles{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
.tiles span{font-family:var(--num);font-weight:700;font-size:58px;line-height:1;width:82px;height:82px;display:grid;place-items:center;border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--drop);color:var(--on-color)}
.tiles span:nth-child(1){background:var(--sun);transform:rotate(-6deg)}
.tiles span:nth-child(2){background:var(--surface);color:var(--ink);font-size:44px;width:62px}
.tiles span:nth-child(3){background:var(--sky);transform:rotate(5deg)}
.hero h1{font-size:30px;margin-top:10px}
.chips{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}

/* quests */
.quests h2{font-size:21px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.quests h2 small{font-size:14px;color:var(--muted);font-weight:400;margin-left:auto}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.quest{display:flex;align-items:center;gap:12px;background:var(--surface2);border:2px solid var(--edge);border-radius:16px;padding:10px 12px}
.qicon{font-size:26px;width:36px;text-align:center;flex:none}
.qbody{flex:1;min-width:0}
.qtext{font-weight:700}
.bar{height:10px;background:var(--track);border-radius:99px;margin-top:6px;overflow:hidden;border:2px solid var(--edge)}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .5s}
.count{font-family:var(--num);font-weight:600;color:var(--muted);flex:none}
.claimed{color:var(--mint);font-weight:700;flex:none;font-size:15px}
.quest.got{opacity:.7}
.quest.ready{background:color-mix(in srgb,var(--sun) 28%,var(--surface2))}
.bonus{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);padding:2px 4px}
.bonus b{color:var(--ink)}

/* modes */
/* 熱氣球選單：每個玩法一顆，慢慢上下漂浮 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;margin-top:22px}
.bal{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;
  animation:balfloat var(--t,4.6s) ease-in-out var(--d,0s) infinite}
.bal .env{position:relative;width:100%;max-width:140px;aspect-ratio:100/130;transition:transform .1s;
  filter:drop-shadow(0 5px 3px rgba(28,42,74,.18))}
.bal .env svg{display:block;width:100%;height:100%;color:var(--edge)}
.bal .env i{position:absolute;left:50%;top:33%;translate:-50% -50%;font-style:normal;
  font-size:clamp(26px,8.6vw,37px);line-height:1;filter:drop-shadow(0 2px 2px rgba(60,40,20,.32))}
.bal .tag{margin-top:5px;font-family:var(--zh);font-size:12px;font-weight:700;line-height:1.6;padding:1px 11px 2px;
  border:2px solid var(--edge);border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.bal b{margin-top:7px;font-size:18px;line-height:1.25}
.bal .sub{font-size:13px;line-height:1.4;color:var(--muted);margin-top:1px}
.bal:active .env{transform:scale(.94)}
.bal:active .tag{transform:translateY(3px);box-shadow:none}
@keyframes balfloat{0%,100%{translate:0 0} 50%{translate:0 -10px}}

/* picker */
.seg{display:flex;background:var(--surface2);border:3px solid var(--edge);border-radius:16px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--sky);color:#fff}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pickbtn{background:var(--surface);border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--drop);padding:12px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s,box-shadow .08s}
.pickbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.pickbtn .n{font-family:var(--num);font-weight:700;font-size:34px;line-height:1}
.pickbtn .lbl{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--mint)}
.mixbtn{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;font-weight:700;font-size:19px;background:var(--grape);color:#fff;padding:16px}
.mixbtn small{font-weight:400;font-size:14px;opacity:.9}
.note{color:var(--muted);font-size:14px;text-align:center;margin-top:14px}

/* play */
.playbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.track{flex:1;height:18px;background:var(--surface);border:3px solid var(--edge);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--mint);transition:width .35s}
.track.time i{background:var(--sun);transition:width 1s linear}
.track.time.low i{background:var(--tomato)}
.qnum{font-family:var(--num);font-weight:600;color:var(--muted);min-width:52px;text-align:right}
.combo{height:30px;display:flex;justify-content:center;margin-bottom:6px}
.combo span{background:var(--tomato);color:#fff;font-weight:700;border:2px solid var(--edge);border-radius:999px;padding:1px 14px}
.combo span.pulse{animation:pulse .4s}
.qcard{background:var(--surface);border:3px solid var(--edge);border-radius:26px;box-shadow:0 6px 0 var(--drop);padding:22px 12px 16px;text-align:center;min-height:212px}
.qcard.enter{animation:popin .3s ease-out}
.q{display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,14px);font-family:var(--num);font-weight:700;font-size:clamp(46px,13vw,80px);line-height:1}
.q .op{color:var(--muted);font-weight:600;font-size:.75em}
.slot{min-width:1.6em;padding:4px 8px;border:3px dashed var(--edge);border-radius:18px;color:var(--muted);transition:background .2s}
.slot.typed{color:var(--ink);border-style:solid}
.qcard.right .slot{background:var(--mint);color:#06281A;border-style:solid;animation:bounce .45s}
.qcard.wrong{animation:shake .4s}
.qcard.wrong .slot{background:var(--tomato);color:#fff;border-style:solid}
.slot s{opacity:.7;font-size:.6em;margin-right:6px}
.fb{min-height:64px;margin-top:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.praise{font-size:24px;font-weight:700;color:var(--mint)}
.chant{font-size:20px;letter-spacing:.12em;display:flex;align-items:center;gap:8px;justify-content:center}
.wrongmsg{font-size:19px}
.wrongmsg b{font-family:var(--num);font-size:24px;color:var(--tomato)}
.say{background:var(--surface2);border:2px solid var(--edge);border-radius:99px;cursor:pointer;width:34px;height:34px;font-size:15px;display:grid;place-items:center}
.retrynote{font-size:14px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.key{font-family:var(--num);font-weight:700;font-size:30px;height:62px;border:3px solid var(--edge);border-radius:18px;background:var(--surface);box-shadow:0 4px 0 var(--drop);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.key:active{transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.key.fn{background:var(--surface2);font-size:24px}
.key.ok{background:var(--mint);color:#06281A;font-family:var(--zh);font-size:22px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.choice{font-family:var(--num);font-weight:700;font-size:38px;height:84px;border:3px solid var(--edge);border-radius:20px;background:var(--surface);box-shadow:0 5px 0 var(--drop);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.choice:active{transform:translateY(5px);box-shadow:0 0 0 var(--drop)}
.choice.c0{background:#FFE29A;color:var(--on-color)} .choice.c1{background:#BDE3FF;color:var(--on-color)} .choice.c2{background:#FFC2C2;color:var(--on-color)} .choice.c3{background:#C6F2DC;color:var(--on-color)}
.nextwrap{margin-top:18px;display:flex;justify-content:center}
.bigtime{text-align:center;font-family:var(--num);font-weight:700;font-size:20px;color:var(--muted);margin:-6px 0 8px}

/* result */
.result{text-align:center}
.bigstars{display:flex;justify-content:center;gap:8px;font-size:64px;line-height:1;margin:6px 0 10px}
.bigstars span{opacity:.18;filter:grayscale(1)}
.bigstars span.on{opacity:1;filter:none;animation:starpop .5s both}
.bigstars span.on:nth-child(2){animation-delay:.25s}
.bigstars span.on:nth-child(3){animation-delay:.5s}
.result h2{font-size:28px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.stat{background:var(--surface2);border:2px solid var(--edge);border-radius:16px;padding:10px}
.stat b{display:block;font-family:var(--num);font-size:30px;line-height:1.2}
.stat span{font-size:14px;color:var(--muted)}
.badge{display:inline-block;background:var(--sun);color:var(--on-color);border:2px solid var(--edge);border-radius:99px;padding:2px 12px;font-weight:700;margin-top:6px}
.rbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.qsum{margin:4px 0 16px;color:var(--muted)}

/* gacha */
.gacha{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.machine{position:relative;width:140px;flex:none}
.dome{position:relative;width:140px;height:130px;border:3px solid var(--edge);border-radius:70px 70px 14px 14px;background:color-mix(in srgb,#BDE6FF 70%,var(--surface));overflow:hidden}
.dome::after{content:"";position:absolute;left:18px;top:14px;width:22px;height:40px;border-radius:20px;background:#fff;opacity:.7;transform:rotate(18deg)}
.dome i{position:absolute;width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);background:linear-gradient(var(--c) 50%,#fff 50%)}
.mbase{position:relative;height:78px;margin-top:-3px;background:var(--tomato);border:3px solid var(--edge);border-radius:8px 8px 18px 18px}
.knob{position:absolute;left:18px;top:16px;width:40px;height:40px;border-radius:50%;background:var(--sun);border:3px solid var(--edge)}
.knob::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:7px;margin-left:-3.5px;background:var(--edge);border-radius:4px}
.mouth{position:absolute;right:16px;top:20px;width:46px;height:34px;border-radius:10px;background:#3A1B1B;border:3px solid var(--edge)}
.machine.spin .knob{animation:turn .9s ease-in-out}
.machine.spin .dome{animation:wobble .3s 3}
.gachainfo{flex:1;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.coinline{font-size:18px}
.coinline b{font-family:var(--num);font-size:30px;vertical-align:-2px;margin:0 4px}
.hint{font-size:14px;color:var(--muted)}
.theme{margin-top:22px}
.theme h3{font-size:19px;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.theme h3 small{font-family:var(--num);color:var(--muted);font-weight:500;font-size:15px}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.scell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.sticker{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:3px solid var(--edge);background:var(--sbg);box-shadow:0 0 0 4px #fff inset,0 3px 0 var(--drop);display:grid;place-items:center;cursor:pointer;padding:0;overflow:hidden}
.sticker .emo{font-size:clamp(26px,8vw,40px);line-height:1;position:relative;z-index:1}
.sticker.locked{background:var(--surface2);box-shadow:0 3px 0 var(--drop);cursor:default;border-style:dashed}
.sticker.locked span{font-family:var(--num);font-weight:700;font-size:24px;color:var(--muted)}
.sticker.r-r{border-color:var(--sky);border-width:4px}
.sticker.r-s::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,#ff9a9a33,#ffe08a66,#9affc866,#9ad8ff66,#c8a6ff66,#ff9a9a33);animation:spin 4s linear infinite}
.sticker.r-s{border-color:var(--sun);border-width:4px}
.sname{font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sname.dim{color:var(--muted)}

/* review flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fcard{background:none;border:0;padding:0;cursor:pointer;perspective:700px;aspect-ratio:1}
.fin{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.1,.5,1)}
.fcard.on .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:3px solid var(--edge);border-radius:20px;box-shadow:0 4px 0 var(--drop);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--num);font-weight:700}
.face.front{background:var(--surface);color:var(--ink);font-size:clamp(19px,6vw,28px)}
.face.front small{color:var(--muted);font-size:.72em;margin:0 3px}
.face.back{background:var(--sun);color:var(--on-color);font-size:clamp(32px,10vw,50px);transform:rotateY(180deg)}
.fcard:active .fin{transform:scale(.96) rotateY(var(--ry,0deg))}
.fcard.on:active .fin{--ry:180deg}

/* hunt 尋寶：數字用同色顏料藏在完整場景裡，找到就圈起來 */
.hask{text-align:center;font-family:var(--num);font-weight:700;font-size:clamp(28px,9vw,44px);line-height:1.15;margin-bottom:8px}
.hask .op{color:var(--muted);font-weight:600;font-size:.72em;margin:0 2px}
.hask .hchant{display:block;font-family:var(--zh);font-size:15px;letter-spacing:.04em;color:var(--muted);font-weight:400;margin-top:2px}
.hask .hchant.ok{color:var(--mint);font-weight:700;letter-spacing:.12em;font-size:18px}
.hstrip{display:flex;gap:5px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.hstrip i{font-style:normal;font-family:var(--num);font-weight:700;font-size:13px;min-width:32px;text-align:center;padding:2px 5px;border:2px solid var(--edge);border-radius:99px;background:var(--surface2);color:var(--muted)}
.hstrip i.ok{background:var(--mint);color:#06281A}
.hstrip i.now{background:var(--sun);color:var(--on-color)}
.art{position:relative;container-type:inline-size;isolation:isolate;width:100%;aspect-ratio:1;background:#DCEAF5;border:3px solid var(--edge);border-radius:24px;box-shadow:0 5px 0 var(--drop);overflow:hidden;touch-action:manipulation}
.art::after{content:"";position:absolute;inset:0;z-index:500;pointer-events:none;border-radius:21px;box-shadow:inset 0 0 50px rgba(60,40,20,.22)}
.scenery{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%}
.aobj{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot));line-height:1;pointer-events:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 2px 2px rgba(60,40,20,.28))}
.anum{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot)) skewY(var(--sk));background:none;border:0;padding:2px 4px;line-height:1;cursor:pointer;font-family:var(--num);font-weight:700;color:var(--nc);opacity:var(--op);mix-blend-mode:multiply;touch-action:manipulation}
.anum.on{color:#0C7A4E;opacity:1;mix-blend-mode:normal;cursor:default;z-index:460!important;text-shadow:0 0 7px #fff,0 0 14px #fff,0 0 3px #fff;animation:numpop .7s}
.anum.on::after{content:"";position:absolute;inset:-26% -18%;border:.55cqw solid #15B978;border-radius:50%;animation:ring .5s ease-out}
.anum.bad{animation:hshake .45s}
.anum.hintme{color:#FF2D2D;opacity:1;mix-blend-mode:normal;z-index:460!important;text-shadow:0 0 8px #fff,0 0 16px #fff;animation:pulse .8s 3}
.anum.fade{opacity:0;transition:opacity 1.2s}
.anum.hintme{-webkit-text-stroke:3px #FF5C5C;animation:pulse .8s 3}
.anum.fade{opacity:0;transition:opacity 1.2s}
.splash{position:absolute;width:16cqw;height:16cqw;border-radius:50%;transform:translate(-50%,-50%);background:var(--sp,#FFC83D);pointer-events:none;animation:splash 1.1s ease-out forwards;z-index:450}
.hbtns{display:flex;align-items:center;gap:10px;margin-top:12px}
.hbtns .note{margin:0;text-align:left;flex:1;font-size:15px}
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcell{background:var(--surface);border:3px solid var(--edge);border-radius:20px;box-shadow:0 4px 0 var(--drop);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.gcell .art{box-shadow:none;border-width:2px;border-radius:14px}
.gcap{font-size:13px;color:var(--muted);font-weight:700}
.gcap small{display:block;font-weight:400;font-family:var(--num)}
.artwrap{max-width:300px;margin:4px auto 14px}

/* stages */
.slist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stage{position:relative;text-align:left;background:var(--surface);border:3px solid var(--edge);border-radius:20px;box-shadow:0 4px 0 var(--drop);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .08s,box-shadow .08s}
.stage:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.stage .sno{font-family:var(--num);font-size:14px;color:var(--muted);font-weight:600}
.stage b{font-size:19px}
.stage .ss{font-size:15px;letter-spacing:1px}
.stage.done{background:color-mix(in srgb,var(--mint) 26%,var(--surface))}
.stage.boss{background:color-mix(in srgb,var(--grape) 24%,var(--surface))}
.stage.lock{opacity:.5;cursor:not-allowed;box-shadow:0 4px 0 var(--track)}
.stage .q{position:absolute;right:12px;top:12px;font-size:13px;color:var(--muted);font-family:var(--num)}
.stage .dots{margin-top:5px}

/* 蛇蛇彩虹路 */
.snlvs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.snlv{text-align:left;background:var(--surface);border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--drop);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .08s,box-shadow .08s}
.snlv:active{transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.snlv b{font-size:18px}
.snlv span{font-size:13px;color:var(--muted);line-height:1.35}
.snlv .snmeta{font-family:var(--num);font-size:12px}
.snlv.on{color:var(--on-color)}
.snlv.on span{color:var(--on-color);opacity:.85}
.snlv.e.on{background:var(--mint)} .snlv.m.on{background:#8CC9FF}
.snlv.h.on{background:var(--sun)} .snlv.b.on{background:#B9A8FF}
.snhearts{font-size:15px;letter-spacing:1px;white-space:nowrap}
.snbar{display:flex;gap:3px;flex:1;justify-content:center}
.snbar i{width:9px;height:9px;border-radius:50%;border:2px solid var(--edge);background:var(--track)}
.snboard{container-type:inline-size;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:2px;width:min(100%,62vh);aspect-ratio:1;margin:0 auto;padding:5px;background:#24365C;border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--drop);touch-action:none;overflow:hidden}
.sncell{display:grid;place-items:center;border-radius:4px;background:rgba(255,255,255,.055);font-family:var(--num);font-weight:700;font-size:max(10px,calc(53cqw / var(--n)));letter-spacing:-.04em;line-height:1;color:#1C2A4A}
.snbody{border-radius:6px}
.snhead{position:relative;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.3)}
.snhead::before,.snhead::after{content:"";position:absolute;top:24%;width:22%;height:22%;border-radius:50%;background:#fff}
.snhead::before{left:20%} .snhead::after{right:20%}
.snnum{background:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Cpath%20d=%22M12%207.1C10.5%205.1%207.6%204.5%205.7%206%203.7%207.5%203.4%2010.4%204.2%2013.1c.8%202.7%202.7%205.6%204.5%206.5%201.2.6%202.3.1%203.3.1s2.1.5%203.3-.1c1.8-.9%203.7-3.8%204.5-6.5.8-2.7.5-5.6-1.5-7.1-1.9-1.5-4.8-.9-6.3%201.1z%22%20fill=%22%23E8413C%22%20stroke=%22%237A1512%22%20stroke-width=%221%22/%3E%3Cpath%20d=%22M12%207.1C10.5%205.1%207.6%204.5%205.7%206%203.7%207.5%203.4%2010.4%204.2%2013.1c.8%202.7%202.7%205.6%204.5%206.5%22%20fill=%22%23FF6B63%22%20opacity=%22.55%22/%3E%3Cpath%20d=%22M12%206.6c0-1.7.3-2.8%201.1-3.6%22%20fill=%22none%22%20stroke=%22%237A4A22%22%20stroke-width=%221.3%22%20stroke-linecap=%22round%22/%3E%3Cpath%20d=%22M13.1%204.5c1.7-1.9%204.2-1.8%205.1-1.5-.5%201.9-2.6%203.2-5.1%201.5z%22%20fill=%22%2349C27A%22%20stroke=%22%231E7A45%22%20stroke-width=%22.8%22%20stroke-linejoin=%22round%22/%3E%3Cellipse%20cx=%228.4%22%20cy=%229.6%22%20rx=%221.5%22%20ry=%222.4%22%20fill=%22%23fff%22%20opacity=%22.5%22%20transform=%22rotate(-28%208.4%209.6)%22/%3E%3C/svg%3E") center/100% 100% no-repeat;
  color:#FFF6E8;text-shadow:0 1px 2px rgba(90,10,8,.85),0 0 3px rgba(90,10,8,.6);
  padding-top:7%;scale:1.2}
.snrock{background:none;font-size:max(11px,calc(66cqw / var(--n)))}
.snboard.hit{animation:shake .32s}
.snpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:14px auto 0}
.pk{height:56px;border:3px solid var(--edge);border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--drop);font-size:21px;cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.pk:active{transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.pk.up{grid-column:2;grid-row:1} .pk.left{grid-column:1;grid-row:2}
.pk.mid{grid-column:2;grid-row:2;background:var(--surface2);font-size:17px}
.pk.right{grid-column:3;grid-row:2} .pk.down{grid-column:2;grid-row:3}
.pk.hide{grid-column:3;grid-row:1;background:var(--surface2);font-size:14px;height:34px;align-self:start}

/* 配對消消樂 */
.snlvs.three{grid-template-columns:repeat(3,1fr)}
.snlv.s-same.on{background:#FFC2DE} .snlv.s-diff.on{background:#B9A8FF}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pgrid.two{grid-template-columns:repeat(2,1fr)}
.pcard{aspect-ratio:1;display:grid;place-items:center;gap:1px;background:var(--surface);border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--drop);padding:4px;cursor:pointer;font-family:var(--num);font-weight:700;font-size:clamp(21px,6.6vw,32px);color:var(--ink);transition:transform .08s,box-shadow .08s}
.pcard:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.pcard:disabled{cursor:default}
.pcard small{color:var(--muted);font-size:.68em;margin:0 1px}
.pcard .pv{font-style:normal;font-size:.8em}
.pcard.sel{background:var(--sun);color:var(--on-color);transform:translateY(3px);box-shadow:0 1px 0 var(--drop)}
.pcard.ok{background:var(--pc,var(--mint));color:#1C2A4A;animation:bounce .45s}
.pcard.ok small{color:#1C2A4A;opacity:.65}
.pcard.bad{background:var(--tomato);color:#fff;animation:shake .4s}
.pcard.bad small{color:#fff;opacity:.8}
.pcard.no{opacity:.5}
.pcard.two{aspect-ratio:4/3;font-size:clamp(19px,5.8vw,28px)}
.pcard .peq{font-style:normal;font-size:.8em;color:var(--muted)}
.pcard.ok .peq,.pcard.bad .peq{color:inherit}

/* 認識乘法 */
.lask{font-family:var(--zh);font-size:clamp(21px,6vw,29px)}
.lbox{background:var(--surface);border:3px solid var(--edge);border-radius:24px;box-shadow:0 5px 0 var(--drop);padding:12px 8px;display:flex;flex-direction:column;gap:7px;align-items:center}
.lrow{display:flex;gap:3px;align-items:center;justify-content:center;background:var(--surface2);border:2px dashed var(--edge);border-radius:14px;padding:3px 7px}
.lrow .ln{font-family:var(--num);font-weight:700;color:var(--muted);font-size:13px;min-width:1.1em;opacity:0;transition:opacity .25s}
.lbox.count .ln{opacity:1}
.li{font-size:clamp(15px,5vw,30px);line-height:1.15}
.lbox.bad{animation:shake .4s}
.lslots{display:flex;align-items:flex-start;justify-content:center;gap:7px;font-family:var(--num);font-weight:700;font-size:clamp(26px,8vw,40px);margin:14px 0 2px}
.lpair{display:flex;flex-direction:column;align-items:center;gap:1px}
.lpair small{font-family:var(--zh);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.02em}
.lslots .op{margin-top:.18em}
.lslots .op{color:var(--muted);font-size:.66em}
.lslot{min-width:1.8em;padding:2px 8px;border:3px dashed var(--edge);border-radius:16px;background:var(--surface);color:var(--muted);cursor:pointer;font:inherit}
.lslot.on{border-style:solid;background:var(--sun);color:var(--on-color)}
.lslot.has{border-style:solid;color:var(--ink)}
.lans{min-width:1.6em;text-align:center;color:var(--muted)}
.lans.on{color:var(--mint)}
.lkeys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.lkey{font-family:var(--num);font-weight:700;font-size:26px;height:54px;border:3px solid var(--edge);border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--drop);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.lkey:active{transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.lkey.fn{background:var(--surface2);font-size:21px}

/* 說明小幫手 */
.helper{display:flex;gap:9px;align-items:flex-start;background:var(--surface2);border:2px dashed var(--edge);border-radius:16px;padding:9px 12px;margin:0 0 14px;font-size:15px;line-height:1.45}
.helper b{font-size:21px;line-height:1.15;flex:none}
.helper .q{margin-left:auto;flex:none;font-size:13px;color:var(--muted);white-space:nowrap}
.helplist{text-align:left;margin:4px 0 2px;padding-left:22px}
.helplist li{margin:7px 0;line-height:1.5}
.sheet .owl{font-size:44px;line-height:1}

/* challenger */
.who{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:3px solid var(--edge);border-radius:999px;box-shadow:0 4px 0 var(--drop);padding:5px 14px 5px 8px;margin-top:12px;cursor:pointer;font-weight:700;font-size:17px}
.who .ava{font-size:24px;line-height:1}
.who .sw{font-size:13px;color:var(--muted);font-weight:400}
.tiertabs{display:flex;gap:6px;margin-bottom:10px}
.tt{flex:1;min-width:0;background:var(--surface2);border:2px solid var(--edge);border-radius:14px;padding:7px 4px;cursor:pointer;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.tt i{font-style:normal;font-family:var(--num);font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tt.on{color:var(--on-color)}
.tt.on i{color:var(--on-color);opacity:.8}
.tt.e.on{background:var(--mint)} .tt.m.on{background:#8CC9FF} .tt.h.on{background:#B9A8FF}
.tdesc{font-size:13px;color:var(--muted);margin-bottom:10px}

/* players */
.plist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:3px solid var(--edge);border-radius:20px;box-shadow:0 4px 0 var(--drop);padding:12px}
.prow.on{background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.pava{font-size:30px;width:48px;height:48px;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--edge);border-radius:50%;flex:none}
.pbody{flex:1;min-width:0}
.pname{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now{font-size:12px;background:var(--mint);color:#06281A;border:2px solid var(--edge);border-radius:99px;padding:0 8px;font-weight:700}
.pstat{font-size:14px;color:var(--muted);font-family:var(--num);margin-top:2px}
.pacts{display:flex;gap:6px;align-items:center;flex:none}
.iconbtn.small{width:32px;height:32px;font-size:14px}

/* name form */
.flab{font-size:14px;color:var(--muted);margin-bottom:6px;display:block;text-align:left}
.field{width:100%;font:inherit;font-family:var(--zh);font-size:20px;font-weight:700;color:var(--ink);background:var(--surface2);border:3px solid var(--edge);border-radius:16px;padding:10px 14px;margin-bottom:14px}
.avas{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ava-opt{font-size:23px;aspect-ratio:1;background:var(--surface2);border:2px solid var(--edge);border-radius:14px;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.ava-opt.on{background:var(--sun)}
.formrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,18,40,.55);display:grid;place-items:center;padding:20px;animation:fade .2s}
.sheet{background:var(--surface);border:3px solid var(--edge);border-radius:26px;box-shadow:0 6px 0 var(--drop);padding:24px 20px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.sheet h3{font-size:24px}
.sheet p{color:var(--muted)}
.reveal{position:relative;width:170px;height:170px;display:grid;place-items:center;margin:6px 0}
.rays{position:absolute;inset:-26px;border-radius:50%;background:repeating-conic-gradient(var(--sun) 0 12deg,transparent 12deg 24deg);opacity:.55;animation:spin 6s linear infinite;mask:radial-gradient(circle,#000 40%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 40%,transparent 70%)}
.reveal .sticker{width:150px;animation:revealpop .6s cubic-bezier(.2,1.6,.4,1) both;cursor:default}
.reveal .sticker .emo{font-size:76px}
.rar{display:inline-block;border:2px solid var(--edge);border-radius:99px;padding:1px 12px;font-weight:700;font-size:14px}
.rar.n{background:var(--surface2)} .rar.r{background:#BDE3FF;color:var(--on-color)} .rar.s{background:var(--sun);color:var(--on-color)}
.sheet .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* toast + fx */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--bg);font-weight:700;padding:11px 18px;border-radius:16px;z-index:30;transition:transform .3s,opacity .3s;opacity:0;visibility:hidden;max-width:calc(100% - 28px);text-align:center;font-size:16px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.cf{position:absolute;width:10px;height:14px;border-radius:3px;animation:cf 1.1s ease-out forwards}
.floaty{position:absolute;font-family:var(--num);font-weight:700;font-size:30px;color:var(--mint);animation:floatup .9s ease-out forwards;-webkit-text-stroke:1px var(--edge)}

@keyframes popin{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.25)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.25)}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:none}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes wobble{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes revealpop{0%{transform:scale(0) rotate(-120deg)}100%{transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes hshake{0%,100%{translate:0 0}25%{translate:-9px 0}50%{translate:9px 0}75%{translate:-5px 0}}
@keyframes numpop{0%{scale:.8}50%{scale:1.55}100%{scale:1}}
@keyframes splash{0%{scale:0;opacity:0}20%{opacity:.55}100%{scale:6;opacity:0}}
@keyframes ring{0%{scale:2.2;opacity:0}60%{opacity:1}100%{scale:1;opacity:1}}
@keyframes floatup{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-70px);opacity:0}}

@media (max-width:420px){
  .snlvs{grid-template-columns:1fr}
  .pk{height:52px}
  .prow{flex-wrap:wrap}
  .pacts{width:100%;justify-content:flex-end}
  .topbar .in{gap:6px;padding:10px 10px}
  .pill{padding:2px 9px;font-size:16px}
  .tt{font-size:14px}
  .tiles span{width:70px;height:70px;font-size:48px}
  .tiles span:nth-child(2){width:52px;font-size:36px}
  .sgrid{grid-template-columns:repeat(4,1fr)}
  .gacha{flex-direction:column;align-items:center;text-align:center}
  .gachainfo{align-items:center}
  .picks{gap:9px}
}
@media (max-height:760px){
  .snboard{width:min(100%,50vh)}
  .pk{height:46px}
  .snpad{gap:6px;margin-top:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

<script>

const AVA_SET = new Set(AVATARS);
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const ID_RE = /^[a-z0-9]{1,24}$/;

const obj = v => (v && typeof v==='object' && !Array.isArray(v)) ? v : {};
function num(v,max){ const n=Math.floor(Number(v)); return (isFinite(n) && n>0) ? Math.min(n,max) : 0; }
function fixFacts(src){
  const f=obj(src), out={};
  for(let a=1;a<=9;a++) for(let b=a;b<=9;b++){
    const k=a+'x'+b, v=obj(f[k]);
    if(f[k]) out[k]={ c:num(v.c,999999), w:num(v.w,999999), s:num(v.s,999) };
  }
  return out;
}
function fixOwned(src){
  const o=obj(src), out={};
  STICKERS.forEach(s=>{ const v=o[s.id]; if(typeof v==='string' && DATE_RE.test(v)) out[s.id]=v; });
  return out;
}
function fixStages(src){
  const s=obj(src), out={};
  STAGES.forEach(S=>{ const v=obj(s[S.n]); if(v.cleared) out[S.n]={cleared:true, stars:Math.min(3,num(v.stars,3))}; });
  return out;
}
function fixArt(src){
  if(!Array.isArray(src)) return [];
  const out=[];
  src.slice(0,MAX_ART).forEach(x=>{
    const a=obj(x), t=Math.floor(Number(a.t)), k=num(a.k,9e15);
    if(t>=2 && t<=9 && typeof a.d==='string' && DATE_RE.test(a.d))
      out.push({ t, s:num(a.s,9999)%SCENES.length, k, d:a.d });
  });
  return out;
}
function fixP(src){
  const p=obj(src), out=blankP();
  Object.keys(out).forEach(k=>{ if(typeof out[k]==='number') out[k]=num(p[k],999999); });
  const tb=obj(p.tables); for(let t=2;t<=9;t++) if(tb[t]) out.tables[t]=true;
  const rv=obj(p.revk); for(let t=2;t<=9;t++) if(rv[t]) out.revk[t]=1;
  return out;
}
function fixDaily(src){
  const d=obj(src);
  if(typeof d.date!=='string' || !DATE_RE.test(d.date)) return null;
  const out={ date:d.date, tiers:{}, p:fixP(d.p) };
  const ts=obj(d.tiers);
  TIER_IDS.forEach(id=>{
    const t=obj(ts[id]), cl=Array.isArray(t.claimed)?t.claimed:[], nt=Array.isArray(t.notified)?t.notified:[];
    /* quests 不從存檔讀：由日期 + 難度的亂數種子重新產生，內容保證一致且不可被竄改 */
    out.tiers[id]={ quests:null, claimed:[!!cl[0],!!cl[1],!!cl[2]], bonus:!!t.bonus, notified:[!!nt[0],!!nt[1],!!nt[2]] };
  });
  return out;
}
function fixPlayer(src){
  const p=obj(src), out=blankPlayer();
  out.id = (typeof p.id==='string' && ID_RE.test(p.id)) ? p.id : uid();
  out.name = String(p.name==null?'':p.name).slice(0,10).trim() || '挑戰者';
  out.avatar = AVA_SET.has(p.avatar) ? p.avatar : AVATARS[0];
  out.createdAt = num(p.createdAt, 9e15) || Date.now();
  out.stars = num(p.stars, 999999);
  out.coins = num(p.coins, 999999);
  out.timedBest = num(p.timedBest, 999);
  out.snakeBest = num(p.snakeBest, 9999);
  out.owned = fixOwned(p.owned);
  out.facts = fixFacts(p.facts);
  out.stages = fixStages(p.stages);
  out.art = fixArt(p.art);
  const st=obj(p.streak);
  out.streak = { last:(typeof st.last==='string'&&DATE_RE.test(st.last))?st.last:'', count:num(st.count,999999) };
  out.daily = fixDaily(p.daily);
  return out;
}
function migrate(s){
  const d = defaultState(), raw = obj(s), ss = obj(raw.settings);
  d.settings = { muted: !!ss.muted, input: ss.input==='choice' ? 'choice' : 'type',
    helped: !!ss.helped, pad: ss.pad!==false };
  d.savedAt = num(raw.savedAt, 9e15);
  if(Array.isArray(raw.players)){
    d.players = raw.players.slice(0,MAX_PLAYERS).map(fixPlayer);
    d.activeId = typeof raw.activeId==='string' ? raw.activeId : '';
  } else if(raw.stars || raw.coins || Object.keys(obj(raw.facts)).length || Object.keys(obj(raw.owned)).length){
    /* 舊版單人存檔 → 變成第一位挑戰者 */
    d.players = [fixPlayer({ name:'挑戰者 1', avatar:AVATARS[0], stars:raw.stars, coins:raw.coins,
      owned:raw.owned, facts:raw.facts, art:raw.art, streak:raw.streak, timedBest:raw.timedBest,
      snakeBest:raw.snakeBest, daily:raw.daily })];
    d.activeId = d.players[0].id;
  }
  if(!d.players.some(p=>p.id===d.activeId)) d.activeId = d.players.length?d.players[0].id:'';
  return d;
}

function save(){

async function pushCloud(){
  if(!cloudRef) return;
  if(cloudBusy){ cloudDirty=true; return; }
  cloudBusy=true;
  try{ await cloudRef.set({json:JSON.stringify(state), savedAt:state.savedAt}); }catch(e){}
  cloudBusy=false;
  if(cloudDirty){ cloudDirty=false; pushCloud(); }
}
async function initCloud(){
  for(let i=0;i<30 && !(window.claude && typeof window.claude.use==='function');i++){ await new Promise(r=>setTimeout(r,100)); }
  if(!(window.claude && typeof window.claude.use==='function')) return;
  try{
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    if(!user || !db) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.doc('data/users/'+id+'/progress');
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    cloudRef = ref;
    const d = snap.exists ? snap.data() : null;
    if(d && d.savedAt > (state.savedAt||0) && !game){
      state = migrate(JSON.parse(d.json));
      try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
      updateTop(); go(currentView==='play'||currentView==='result' ? 'home' : currentView);
    } else if(!d || (state.savedAt||0) > d.savedAt){
      pushCloud();
    }
  }catch(e){ /* stay with this device's save */ }
}

function todayStr(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return todayStr(d); }
function seeded(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
}
const TIERS = [
  {id:'e', name:'初階', icon:'🌱', bonus:1, desc:'剛開始的小任務，輕鬆完成'},
  {id:'m', name:'中階', icon:'⚡', bonus:1, desc:'多一點挑戰，任務也多一點'},
  {id:'h', name:'高階', icon:'🔥', bonus:2, desc:'高手級任務，獎勵最多'}
];
const TIER_BY = {}; TIERS.forEach(T=>{ TIER_BY[T.id]=T; });
const TIER_POOL = {
  e:['correct','rounds','table','combo','timed','review','hunt','snake','learn','pair'],
  m:['correct','rounds','table','combo','timed','perfect','mix','stage','hunt','snake','pair'],
  h:['correct','rounds','table','combo','timed','perfect','mix','master','stage','hunt','snake','pair']
};
const TIER_TARGET = {
  correct:{e:[8,10,12],  m:[15,18,20], h:[20,25,30]},
  rounds: {e:[1],        m:[2],        h:[2,3]},
  combo:  {e:[3,4,5],    m:[5,6,8],    h:[6,8,10]},
  timed:  {e:[3,4,5],    m:[5,6,8],    h:[6,8,10]},
  review: {e:[1],        m:[1],        h:[2]},
  stage:  {e:[1],        m:[1,2],      h:[2,3]},
  hunt:   {e:[1],        m:[1,2],      h:[2]},
  snake:  {e:[1],        m:[1,2],      h:[2,3]},
  learn:  {e:[1],        m:[1],        h:[1]},
  pair:   {e:[1],        m:[1,2],      h:[2]},
  master: {e:[1],        m:[2],        h:[2,3]}
};
const TABLE_RANGE = {e:[2,5], m:[5,9], h:[3,9]};
function makeQuests(date, tier){
  const r = seeded('mul99'+date+'#'+tier);
  const pick = arr => arr[Math.floor(r()*arr.length)];
  const types = TIER_POOL[tier].slice();
  for(let i=types.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [types[i],types[j]]=[types[j],types[i]]; }
  return types.slice(0,3).map(type=>{
    if(type==='table'){ const lo=TABLE_RANGE[tier][0], hi=TABLE_RANGE[tier][1]; return {type, t:lo+Math.floor(r()*(hi-lo+1)), target:1}; }
    if(type==='perfect' || type==='mix') return {type, target:1};
    return {type, target:pick(TIER_TARGET[type][tier])};
  });
}
const QUEST_ICON = {correct:'✅', rounds:'📘', table:'🎯', combo:'🔥', timed:'⏱️', perfect:'💯', mix:'🎲', master:'🌟', review:'🃏', stage:'🗺️', hunt:'🔍', snake:'🐍', learn:'🍡', pair:'🧩'};
function questText(q){
  switch(q.type){
    case 'correct': return `答對 ${q.target} 題`;
    case 'rounds':  return `完成 ${q.target} 回練習`;
    case 'table':   return `完成一回「${q.t} 的乘法」`;
    case 'combo':   return `連續答對 ${q.target} 題`;
    case 'timed':   return `限時挑戰答對 ${q.target} 題`;
    case 'review':  return q.target>1?`複習 ${q.target} 張乘法表`:'複習完一張乘法表';
    case 'stage':   return q.target>1?`闖關通過 ${q.target} 關`:'闖關通過 1 關';
    case 'hunt':    return q.target>1?`完成 ${q.target} 張尋寶畫`:'完成一張尋寶畫';
    case 'snake':   return q.target>1?`用蛇蛇吃出 ${q.target} 條彩虹`:'用蛇蛇吃出一條彩虹';
    case 'learn':   return '玩一回「認識乘法」';
    case 'pair':    return q.target>1?`完成 ${q.target} 回配對消消樂`:'完成一回配對消消樂';
    case 'mix':     return '完成一回綜合挑戰';
    case 'master':  return `讓 ${q.target} 組題目變熟練`;
    default:        return '一回練習全部答對';
  }
}
function blankP(){ return {correct:0, rounds:0, maxCombo:0, timedBest:0, tables:{}, perfect:0,
  mix:0, mastered:0, reviews:0, revk:{}, stagesCleared:0, stageCoins:0, firstCoins:0, hunts:0,
  snakes:0, rainbows:0, learns:0, pairs:0}; }
function blankTier(date,id){ return {quests:makeQuests(date,id), claimed:[false,false,false], bonus:false, notified:[false,false,false]}; }
function ensureDaily(){
  const m = me();
  if(!m) return null;
  const t = todayStr();
  let d = m.daily;
  if(!d || d.date!==t){
    const keep = (d && d.date===t) ? d.p : null;   /* 同一天換版本，進度留著 */
    d = m.daily = { date:t, tiers:{}, p:keep || blankP() };
    save();
  }
  if(!d.tiers) d.tiers = {};
  const base = blankP();                            /* 舊存檔補上新欄位，不換掉物件 */
  Object.keys(base).forEach(k=>{ if(d.p[k]===undefined) d.p[k]=base[k]; });
  TIERS.forEach(T=>{
    let tt = d.tiers[T.id];
    if(!tt) tt = d.tiers[T.id] = blankTier(t,T.id);
    if(!tt.quests) tt.quests = makeQuests(t,T.id);   /* 任務內容一律由種子重算 */
  });
  return d;
}
function progressOf(q){
  const p = me().daily.p;
  switch(q.type){
    case 'correct': return p.correct;
    case 'rounds':  return p.rounds;
    case 'table':   return p.tables[q.t]?1:0;
    case 'combo':   return p.maxCombo;
    case 'timed':   return p.timedBest;
    case 'review':  return p.reviews;
    case 'stage':   return p.stagesCleared;
    case 'hunt':    return p.hunts;
    case 'snake':   return p.rainbows;
    case 'learn':   return p.learns;
    case 'pair':    return p.pairs;
    case 'mix':     return p.mix;
    case 'master':  return p.mastered;
    default:        return p.perfect;
  }
}
function questDone(tier,i){ const q=me().daily.tiers[tier].quests[i]; return progressOf(q)>=q.target; }
function doneCount(tier){ const t=me().daily.tiers[tier]; return t.quests.filter((q,i)=>questDone(tier,i)).length; }
function tierFinished(tier){ const t=me().daily.tiers[tier]; return t.claimed.every(Boolean) && t.bonus; }
function anyClaimable(){
  const d = ensureDaily(); if(!d) return false;
  return TIERS.some(T=>{
    const t = d.tiers[T.id];
    return t.quests.some((q,i)=>questDone(T.id,i)&&!t.claimed[i]) || (t.claimed.every(Boolean)&&!t.bonus);
  });
}
function defaultTier(){
  const d = ensureDaily();
  for(let i=0;i<TIERS.length;i++){ if(!tierFinished(TIERS[i].id)) return TIERS[i].id; }
  return 'h';
}
function checkQuests(){
  const d = ensureDaily(); if(!d) return;
  let n = 0;
  TIERS.forEach(T=>{
    const t = d.tiers[T.id];
    t.quests.forEach((q,i)=>{
      if(!t.notified[i] && questDone(T.id,i)){
        t.notified[i] = true;
        const delay = 500 + (n++)*1100;
        setTimeout(()=>{ toast(`${T.icon} ${T.name}任務完成：${questText(q)}！可以去領扭蛋幣 🪙`); sfx.coin(); }, delay);
      }
    });
  });
}
function streakOf(p){ const s=(p&&p.streak)||{}; return (s.last===todayStr()||s.last===yesterdayStr()) ? (s.count||0) : 0; }
function streakNow(){ return streakOf(me()); }
function markPlayed(){
  const m=me(), t=todayStr();
  if(m.streak.last===t) return;
  m.streak.count = m.streak.last===yesterdayStr() ? m.streak.count+1 : 1;
  m.streak.last = t;
}

/* ---------- facts / mastery ---------- */
const key = (a,b) => Math.min(a,b)+'x'+Math.max(a,b);
function record(a,b,ok){
  const m=me(), k=key(a,b), f=m.facts[k]||{c:0,w:0,s:0};
  const before=level(a,b);
  if(ok){ f.c++; f.s++; } else { f.w++; f.s=0; }
  m.facts[k]=f;
  if(ok && before<3 && level(a,b)===3 && m.daily && m.daily.p) m.daily.p.mastered++;
}
function level(a,b){
  const f=me().facts[key(a,b)];
  if(!f || f.c+f.w===0) return 0;
  if(f.s>=3) return 3;
  if(f.s>=1) return 2;
  return 1;
}
function weightOf(a,b){ const l=level(a,b); return [2.2,3.5,1.6,0.5][l]; }

/* ---------- sound ---------- */
let actx=null;
function unlockAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } else if(actx.state==='suspended'){ actx.resume(); } }
function tone(freq,dur,type='sine',when=0,vol=.16){
  if(state.settings.muted || !actx) return;
  try{
    const t=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}

  right(c){ const b=523*Math.pow(2,Math.min(c,12)/12); tone(b,.12,'triangle'); tone(b*1.5,.18,'triangle',.08); },
  wrong(){ tone(240,.18,'square',0,.07); tone(180,.25,'square',.12,.07); },
  coin(){ tone(988,.08,'square',0,.07); tone(1319,.25,'square',.07,.07); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.11)); tone(1319,.5,'triangle',.46); },
  spin(){ for(let i=0;i<8;i++) tone(300+i*40,.05,'square',i*.09,.05); },
  reveal(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.25,'sine',i*.08,.14)); }

/* ---------- fx ---------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const CF_COLORS = ['#FFC83D','#FF5C5C','#25C686','#3FA3FF','#7B61FF','#FF9E6B'];
function burst(x,y,n=24){
  if(reduceMotion) return;
  const fx=document.getElementById('fx');
  for(let i=0;i<n;i++){
    const s=document.createElement('i'); s.className='cf';
    const ang=Math.random()*Math.PI*2, dist=80+Math.random()*160;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.background=CF_COLORS[i%CF_COLORS.length];
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*dist+120)+'px');
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    fx.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
}
function burstAt(el,n){ if(!el) return; const r=el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, n); }
function floaty(el,text){
  if(reduceMotion||!el) return;
  const r=el.getBoundingClientRect(), f=document.createElement('div');
  f.className='floaty'; f.textContent=text; f.style.left=(r.left+r.width/2)+'px'; f.style.top=(r.top-10)+'px';
  document.getElementById('fx').appendChild(f); setTimeout(()=>f.remove(),950);
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

  result(){
    const r=game.result;
    const starsHTML=[1,2,3].map(i=>`<span class="${i<=r.stars?'on':''}">⭐</span>`).join('');
    const artHd = r.hunt && r.art ? `<div class="art artwrap">${artHTML(r.art,{full:true})}</div>` : '';
    const title = r.snake ? (r.rainbows>=3?'彩虹大豐收！🌈':r.rainbows>=1?`吃出 ${r.rainbows} 條彩虹！`:'蛇蛇再長一點就有彩虹了！')
      : r.hunt ? (r.score===r.total?'九個答案全都一次找到！':'九個答案都找到了！')
      : r.stage
      ? (r.cleared ? (r.firstClear?`第 ${r.stage} 關通關！`:`第 ${r.stage} 關再次通關！`) : '差一點點！')
      : (r.stars===3?'太厲害了！':r.stars===2?'做得很好！':'再練習一下會更棒！');
    ensureDaily();
    const dn=TIERS.reduce((s,T)=>s+doneCount(T.id),0);
    const claimable=anyClaimable();
    const statA = r.snake
      ? `<div class="stat"><b>${r.eaten}</b><span>吃到的答案</span></div>`
      : r.timed
      ? `<div class="stat"><b>${r.score}</b><span>60 秒答對題數</span></div>`
      : `<div class="stat"><b>${r.score}/${r.total}</b><span>${r.slabel ? r.slabel : r.hunt?'一次就找到':`第一次就答對${r.stage?`（過關要 ${r.need}）`:''}`}</span></div>`;
    let badge='';
    if(r.newBest) badge='<div class="badge">🏆 新紀錄！</div>';
    else if(r.coins) badge=`<div class="badge">🪙 得到 ${r.coins} 枚扭蛋幣</div>`;
    else if(r.capped) badge='<div class="badge">今天闖關的扭蛋幣領滿了，明天再來拿 🪙</div>';
    const nextN = r.stage && r.cleared && r.stage<STAGES.length ? r.stage+1 : 0;
    view.innerHTML=`
      <section class="card result">
        ${artHd}
        <div class="bigstars">${starsHTML}</div>
        <h2>${title}</h2>
        ${badge}
        <div class="stats">
          ${statA}
          ${r.snake
            ? `<div class="stat"><b>🌈 ${r.rainbows}</b><span>完成的彩虹</span></div>`

/* ---------- game ---------- */
function stageUnlocked(){ return true; }   /* 關卡全開，想練哪一張表都可以 */
function startStage(n){
  const S=STAGES[n-1];
  if(!S) return;
  endGame();
  lastSetup={mode:'stage', stage:n};
  let items=[];
  if(S.table){
    for(let b=1;b<=9;b++) items.push(Math.random()<.3?{a:b,b:S.table}:{a:S.table,b});
    shuffle(items);
    let worst=2+rnd(8), ww=-1;
    for(let b=2;b<=9;b++){ const w=weightOf(S.table,b)+Math.random(); if(w>ww){ww=w;worst=b;} }
    items.push({a:S.table,b:worst});
    items=items.slice(0,S.q);
  } else {
    const pairs=[]; for(let a=2;a<=9;a++) for(let b=2;b<=9;b++){ const w=weightOf(a,b); pairs.push({a,b,w:S.weak?w*w:w}); }
    const used=new Set();
    while(items.length<S.q){
      const pool=pairs.filter(p=>!used.has(key(p.a,p.b)));
      if(!pool.length) break;
      let sum=pool.reduce((s,p)=>s+p.w,0), r=Math.random()*sum;
      const p=pool.find(p=>(r-=p.w)<=0)||pool[0];
      used.add(key(p.a,p.b)); items.push({a:p.a,b:p.b});
    }
  }
  game={mode:'stage', stage:n, table:S.table, input:state.settings.input, queue:items, total:items.length, pos:0,
    firstCorrect:0, combo:0, maxCombo:0, typed:'', locked:false, waiting:false, t:null};
  go('play'); nextQ();
}
function finishStage(){
  const d=ensureDaily(), m=me(), S=STAGES[game.stage-1];
  const score=game.firstCorrect, total=game.total, need=Math.ceil(total*0.8);
  const cleared=score>=need;
  const stars = score===total?3 : score>=total-1?2 : (cleared?1:0);
  const prev=m.stages[game.stage], firstClear=cleared && !prev;
  let coins=0, capped=false;
  if(cleared){
    if(firstClear){
      const room = Math.max(0, STAGE_FIRST_CAP - d.p.firstCoins);
      coins = Math.min(stars===3?2:1, room);
      if(!coins) capped = true;
      d.p.firstCoins += coins;
    }
    else if(d.p.stageCoins<STAGE_COIN_CAP){ coins = 1; d.p.stageCoins += coins; }
    else capped = true;
    if(coins) m.coins += coins;
    m.stages[game.stage]={cleared:true, stars:Math.max(stars, prev?prev.stars:0)};
    d.p.stagesCleared++;
  }
  m.stars+=stars;
  d.p.rounds++;
  if(S.table) d.p.tables[S.table]=true; else d.p.mix++;
  if(score===total) d.p.perfect=1;
  markPlayed();
  game.result={timed:false, stage:game.stage, cleared, firstClear, coins, capped, need,
    score, total, stars, maxCombo:game.maxCombo, newBest:false};
  save(); checkQuests();
  clearTimeout(game.t);
  go('result');
}
function startTimed(){
  endGame();
  lastSetup={mode:'timed'};
  game={mode:'timed', input:state.settings.input, score:0, combo:0, maxCombo:0, typed:'', locked:false, waiting:false,
    timeLeft:60, timer:null, t:null, last:null};
  go('play'); nextQ();
  game.timer=setInterval(()=>{
    if(!game) return;
    game.timeLeft--;
    updateTimeBar();
    if(game.timeLeft<=0) finishTimed();
  },1000);
}
function endGame(){
  if(game){ clearInterval(game.timer); clearTimeout(game.t); }
  game=null;
}
function updateTimeBar(){
  const f=$('#trackfill'), tr=$('#track'), bt=$('#bigtime');
  if(f) f.style.width=(game.timeLeft/60*100)+'%';
  if(tr) tr.classList.toggle('low', game.timeLeft<=10);
  if(bt) bt.textContent=game.timeLeft+' 秒';
}
function nextQ(){
  if(!game) return;
  if(game.mode!=='timed' && game.pos>=game.queue.length) return finishRound();
  let it;
  if(game.mode!=='timed') it=game.queue[game.pos];
  else {
    do{ const a=2+rnd(8), b=2+rnd(8); it={a,b}; } while(game.last && key(it.a,it.b)===game.last);
    game.last=key(it.a,it.b);
  }
  game.cur=it; game.typed=''; game.locked=false; game.waiting=false;
  $('#qa').textContent=it.a; $('#qb').textContent=it.b;
  const slot=$('#slot'); slot.textContent='?'; slot.classList.remove('typed');
  $('#fb').innerHTML='';
  const qc=$('#qcard'); qc.className='qcard'; void qc.offsetWidth; qc.classList.add('enter');
  if(game.mode!=='timed'){
    $('#trackfill').style.width=(game.pos/game.queue.length*100)+'%';
    $('#qnum').textContent=`${Math.min(game.pos+1,game.queue.length)}/${game.queue.length}`;
  } else {
    $('#qnum').textContent=`✅ ${game.score}`;
    updateTimeBar();
  }
  renderInput();
  updateCombo(false);
}
function renderInput(){
  const area=$('#inputArea');
  if(game.input==='choice'){
    const {a,b}=game.cur, ans=a*b;
    const cand=new Set();
    [a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+10,ans-10,(a+1)*(b-1)].forEach(v=>{ if(v>0&&v!==ans&&v<=90) cand.add(v); });
    const opts=shuffle([...cand]).slice(0,3); opts.push(ans); shuffle(opts);
    area.innerHTML=`<div class="choices">${opts.map((o,i)=>`<button class="choice c${i}" data-act="choice" data-arg="${o}">${o}</button>`).join('')}</div>`;

}
function updateCombo(pulse){
  const c=$('#combo'); if(!c) return;

function pressKey(k){
  if(!game) return;
  if(game.locked){ if(k==='ok' && game.waiting) advance(); return; }
  if(k==='del'){ game.typed=game.typed.slice(0,-1); }
  else if(k==='ok'){ if(game.typed) submit(+game.typed); return; }
  else if(game.typed.length<2){ game.typed=(game.typed==='0'?'':game.typed)+k; }
  sfx.tap();
  const slot=$('#slot'); slot.textContent=game.typed||'?'; slot.classList.toggle('typed',!!game.typed);
}
function submit(val){
  if(!game || game.locked) return;
  game.locked=true;
  const it=game.cur, ans=it.a*it.b, ok=val===ans;
  const d=ensureDaily();
  record(it.a,it.b,ok);
  const qc=$('#qcard'), slot=$('#slot'), fb=$('#fb');
  qc.classList.remove('enter');
  if(ok){
    game.combo++; game.maxCombo=Math.max(game.maxCombo,game.combo);
    d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,game.combo);
    if(game.mode!=='timed'){ if(!it.retry) game.firstCorrect++; } else { game.score++; $('#qnum').textContent=`✅ ${game.score}`; }
    slot.textContent=ans; qc.classList.add('right');
    const msg = game.combo>0 && game.combo%5===0 ? `連續 ${game.combo} 題，火力全開！` : PRAISE[rnd(PRAISE.length)];
    fb.innerHTML=`<div class="praise">${msg}</div><div class="chant">${chant(it.a,it.b)}</div>`;
    sfx.right(game.combo);
    floaty(slot,'+1');
    if(game.combo%5===0){ burstAt(slot,36); sfx.fanfare(); } else burstAt(slot,10);
    updateCombo(true);
    game.t=setTimeout(advance, game.mode==='timed'?550:1000);
  } else {
    game.combo=0;
    slot.innerHTML=`<s>${val}</s>${ans}`; qc.classList.add('wrong');
    const ch=chant(it.a,it.b);
    let html=`<div class="wrongmsg">正確答案是 <b>${ans}</b></div><div class="chant">${ch}${canSpeak?`<button class="say" data-act="say" data-arg="${ch}" aria-label="唸口訣">🔊</button>`:''}</div>`;
    if(game.mode!=='timed'){
      if(!it.retry){ game.queue.push({a:it.a,b:it.b,retry:true}); html+='<div class="retrynote">這題等一下會再出現一次</div>'; }
      fb.innerHTML=html;
      $('#inputArea').innerHTML='<div class="nextwrap"><button class="btn big sun" data-act="next">下一題</button></div>';
      game.waiting=true;
      setTimeout(()=>{ const b=document.querySelector('[data-act="next"]'); if(b) b.focus(); },50);
    } else {
      fb.innerHTML=html;
      game.t=setTimeout(advance,1500);
    }
    sfx.wrong();
    updateCombo(false);
  }
  save(); checkQuests();
}
function advance(){
  if(!game) return;
  clearTimeout(game.t);
  if(game.mode!=='timed') game.pos++;
  if(game.mode!=='timed' && game.input==='type' && !document.querySelector('#inputArea .pad')) $('#inputArea').innerHTML='';
  nextQ();
}
function finishRound(){
  if(game.mode==='stage') return finishStage();
  const d=ensureDaily();
  const score=game.firstCorrect, total=game.total, acc=score/total;
  const stars=acc>=.9?3:acc>=.7?2:1;
  me().stars+=stars;
  d.p.rounds++;
  if(game.table) d.p.tables[game.table]=true; else d.p.mix++;
  if(score===total) d.p.perfect=1;
  markPlayed();
  game.result={timed:false, score, total, stars, maxCombo:game.maxCombo, newBest:false};
  save(); checkQuests();
  clearTimeout(game.t);
  go('result');
}
function finishTimed(){
  if(!game) return;
  clearInterval(game.timer); clearTimeout(game.t);
  const d=ensureDaily(), score=game.score;
  const stars=score>=15?3:score>=8?2:1;
  const newBest=score>me().timedBest && score>0;
  if(newBest) me().timedBest=score;
  me().stars+=stars;
  d.p.timedBest=Math.max(d.p.timedBest,score);
  markPlayed();
  game.result={timed:true, score, stars, maxCombo:game.maxCombo, newBest};
  game.locked=true;
  save(); checkQuests();
  go('result');
}

/* ---------- 蛇蛇彩虹路 ---------- */
let snakeLvId = 'e';
function snakeLv(){ return SNAKE_BY[snakeLvId] || SNAKE_LV[0]; }
function startSnake(table, lvId){
  endGame();
  snakeLvId = SNAKE_BY[lvId] ? lvId : snakeLvId;
  const lv = snakeLv(), n = lv.size, mid = Math.floor(n/2);
  lastSetup = {mode:'snake', table, lv:lv.id};
  game = { mode:'snake', table, lv, n,
    snake:[{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}],
    dir:{x:1,y:0}, nextDir:{x:1,y:0},
    hearts:lv.hearts, eaten:0, rainbows:0, combo:0, maxCombo:0,
    qi:0, cur:null, items:[], rocks:[], ms:lv.ms, paused:false, over:false, timer:null, t:null };
  go('snake');
  snakeNextQ();
  paintSnake();
  if(!lv.step) snakeRun();
}
function snakeRun(){
  clearInterval(game.timer);
  game.timer = setInterval(()=>{
    if(!game || game.mode!=='snake') return;
    if(currentView!=='snake'){ endGame(); return; }
    if(game.paused || game.over) return;
    snakeStep();
  }, game.ms);
}
function snakeQuestion(){
  const t = game.table;
  if(t){
    if(game.lv.seq){ const b=(game.qi%9)+1; game.qi++; return {a:t, b}; }
    let b; do{ b = 1+rnd(9); } while(game.cur && b===game.cur.b);
    return {a:t, b};
  }
  const pairs=[]; for(let a=2;a<=9;a++) for(let b=2;b<=9;b++) pairs.push({a,b,w:weightOf(a,b)});
  let sum=pairs.reduce((s,q)=>s+q.w,0), r=Math.random()*sum;
  const q=pairs.find(q=>(r-=q.w)<=0)||pairs[0];
  return {a:q.a, b:q.b};
}
function snakeDecoys(ans,a,b,k){
  const set=new Set();
  const cand=shuffle([a*(b+1), a*(b-1), (a+1)*b, (a-1)*b, ans+1, ans-1, ans+2, ans-2, ans+10, ans-10, b*b, a*a]);
  for(const v of cand){ if(set.size>=k) break; if(v>0 && v<100 && v!==ans) set.add(v); }
  while(set.size<k){ const v=1+rnd(81); if(v!==ans) set.add(v); }
  return [...set];
}
function snakeFree(){
  const g=game, h=g.snake[0];
  for(let i=0;i<400;i++){
    const x=rnd(g.n), y=rnd(g.n);
    if(g.snake.some(s=>s.x===x&&s.y===y)) continue;
    if(g.items.some(s=>s.x===x&&s.y===y)) continue;
    if(g.rocks.some(s=>s.x===x&&s.y===y)) continue;
    if(Math.abs(h.x-x)+Math.abs(h.y-y)<3) continue;
    return {x,y};
  }
  return null;
}
function snakeNextQ(){
  const g=game;
  g.cur = snakeQuestion();
  const ans = g.cur.a*g.cur.b;
  g.items = [];
  const vals = shuffle([{v:ans, ok:true}].concat(
    snakeDecoys(ans, g.cur.a, g.cur.b, g.lv.decoys).map(v=>({v, ok:false}))));
  vals.forEach(it=>{ const c=snakeFree(); if(c) g.items.push({x:c.x, y:c.y, v:it.v, ok:it.ok}); });
  updateSnakeBar();
}
function snakeDir(k){
  const g=game;
  if(!g || g.mode!=='snake' || g.over) return;
  const d = {u:{x:0,y:-1}, d:{x:0,y:1}, l:{x:-1,y:0}, r:{x:1,y:0}}[k];
  if(!d) return;
  if(g.snake.length>1 && d.x===-g.dir.x && d.y===-g.dir.y) return;   /* 不能直接迴轉 */
  g.nextDir = d;
  if(g.paused){ g.paused=false; snakeNote(''); }
  if(g.lv.step){ sfx.tap(); snakeStep(); }
}
function snakePause(){
  const g=game;
  if(!g || g.mode!=='snake' || g.over || g.lv.step) return;
  g.paused = !g.paused;
  snakeNote(g.paused ? '暫停中，慢慢算，按方向鍵或 ▶ 繼續' : '');
  const b=document.querySelector('[data-act="spause"]');
  if(b) b.textContent = g.paused ? '▶' : '⏸';
}
function snakeStep(){
  const g=game, n=g.n;
  g.dir = g.nextDir;
  const h=g.snake[0];
  const nx=(h.x+g.dir.x+n)%n, ny=(h.y+g.dir.y+n)%n;
  if(g.snake.some((sg,i)=> i<g.snake.length-1 && sg.x===nx && sg.y===ny)){
    g.paused = true;
    g.snake.length = Math.max(3, g.snake.length-2);
    snakeHurt('蛇打結了！換個方向再出發');
    paintSnake();
    return;
  }
  const ri = g.rocks.findIndex(r=>r.x===nx && r.y===ny);
  if(ri>=0){
    g.rocks.splice(ri,1);
    g.snake.length = Math.max(3, g.snake.length-1);
    snakeHurt('撞到石頭了！');
    paintSnake();
    return;
  }
  const ii = g.items.findIndex(it=>it.x===nx && it.y===ny);
  g.snake.unshift({x:nx, y:ny});
  if(ii>=0){
    const it=g.items[ii];
    if(it.ok){ snakeEat(); }
    else { g.items.splice(ii,1); g.snake.pop(); snakeMiss(it.v); }
  } else {
    g.snake.pop();
  }
  if(!g.over) paintSnake();
}
function snakeEat(){
  const g=game, a=g.cur.a, b=g.cur.b, d=ensureDaily();
  record(a,b,true);
  g.eaten++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);   /* 吃一個，整條蛇的彩虹就轉一格 */
  d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,g.combo);
  sfx.right(g.combo); say(chant(a,b));
  snakeNote(`${chant(a,b)}　${PRAISE[rnd(PRAISE.length)]}`);
  const head=document.querySelector('.snhead');
  if(head) burstAt(head, 10);
  if(g.eaten % RAINBOW.length === 0){
    g.rainbows++; d.p.rainbows++;
    sfx.fanfare(); toast(`🌈 完成第 ${g.rainbows} 條彩虹！蛇變長了`);
    if(head) burstAt(head, 40);
    if(g.lv.up && g.ms>g.lv.min){ g.ms=Math.max(g.lv.min, g.ms-g.lv.up); snakeRun(); }
    if(g.lv.rocks) for(let i=0;i<2;i++){ const c=snakeFree(); if(c) g.rocks.push(c); }
  }
  snakeNextQ();
  save(); checkQuests();
}
function snakeMiss(v){
  const g=game, a=g.cur.a, b=g.cur.b;
  record(a,b,false);
  g.combo=0;
  const inTable = v%a===0 && v/a>=1 && v/a<=9;
  snakeHurt(inTable ? `那是 ${a} × ${v/a} = ${v} 喔，要找 ${a} × ${b}` : `${v} 不是 ${a} 的乘法喔`);
}
function snakeHurt(msg){
  const g=game;
  g.hearts--;
  sfx.wrong();
  snakeNote(msg);
  const b=document.getElementById('snboard');
  if(b){ b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit'); }
  save();
  if(g.hearts<=0) finishSnake(); else updateSnakeBar();
}
function snakeNote(msg){
  const el=document.getElementById('snnote');
  if(!el) return;
  el.textContent = msg || (game && game.lv.step ? '按方向鍵走一步，慢慢算沒關係' : '滑動畫面或按方向鍵轉彎');
}
function updateSnakeBar(){
  const g=game; if(!g || g.mode!=='snake') return;
  const h=document.getElementById('snhearts');
  if(h) h.textContent = '❤️'.repeat(Math.max(0,g.hearts)) + '🖤'.repeat(Math.max(0, g.lv.hearts-g.hearts));
  const bar=document.getElementById('snbar');
  if(bar) bar.innerHTML = RAINBOW.map((c,i)=>
    `<i style="background:${i < g.eaten%RAINBOW.length ? c : 'var(--track)'}"></i>`).join('');
  const q=document.getElementById('snq');
  if(q && g.cur) q.innerHTML = `${g.cur.a} <span class="op">×</span> ${g.cur.b} <span class="op">=</span> ?`;
  const n=document.getElementById('qnum');
  if(n) n.textContent = `🌈 ${g.rainbows}`;
}
/* 整條蛇隨時都是彩虹：頭是目前的顏色，往後依序排七色；每吃一個就整體位移一格 */
function snakeColor(i){ return RAINBOW[(game.eaten + i) % RAINBOW.length]; }
function paintSnake(){
  const g=game, el=document.getElementById('snboard');
  if(!el || !g || g.mode!=='snake') return;
  const c=el.children;
  for(let i=0;i<c.length;i++){
    if(c[i].className!=='sncell'){ c[i].className='sncell'; c[i].textContent=''; c[i].style.background=''; }
  }
  const at=(x,y)=>c[y*g.n+x];
  g.rocks.forEach(r=>{ const e=at(r.x,r.y); if(e){ e.className='sncell snrock'; e.textContent='🪨'; } });
  g.items.forEach(it=>{ const e=at(it.x,it.y); if(e){ e.className='sncell snnum'; e.textContent=it.v; } });
  g.snake.forEach((sg,i)=>{
    const e=at(sg.x,sg.y);
    if(e){ e.className='sncell '+(i===0?'snhead':'snbody'); e.style.background=snakeColor(i); e.textContent=''; }
  });
}
function snakePadHTML(){

  return `<div class="snpad">

function bindSwipe(){
  const b=document.getElementById('snboard');
  if(!b) return;
  let sx=0, sy=0, on=false;
  b.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; on=true; }, {passive:true});
  b.addEventListener('touchmove', e=>{

    const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<22 && Math.abs(dy)<22) return;

    snakeDir(Math.abs(dx)>Math.abs(dy) ? (dx>0?'r':'l') : (dy>0?'d':'u'));

}
function finishSnake(){
  const g=game, d=ensureDaily(), m=me();
  g.over=true;
  clearInterval(g.timer);
  const stars=Math.max(1, Math.min(3, g.rainbows));
  m.stars+=stars;
  const newBest = g.eaten > (m.snakeBest||0);
  if(newBest) m.snakeBest = g.eaten;
  d.p.snakes++;
  markPlayed();
  g.result={ snake:true, timed:false, eaten:g.eaten, rainbows:g.rainbows, len:g.snake.length,
    lv:g.lv.name, stars, maxCombo:g.maxCombo, newBest, score:g.eaten, total:g.eaten };
  save(); checkQuests();
  snakeNote('蛇蛇休息一下⋯⋯');
  g.t=setTimeout(()=>{ if(game && game.result) go('result'); }, reduceMotion?300:1100);

/* ---------- 尋寶模式：數字融進完整場景裡，隨機出題，找到就圈起來 ---------- */
/* 一張畫只存 {乘法表, 場景, 亂數種子, 日期}，畫面都用種子重新算出來，所以畫廊能永遠重現同一張 */
function artRand(a){ return seeded('mul99art#'+a.t+'#'+a.s+'#'+a.k); }
function artScene(a){ return SCENES[((a.s%SCENES.length)+SCENES.length)%SCENES.length]; }
function artLayout(a){
  const r=artRand(a), S=artScene(a);
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const mix=arr=>{ const b=arr.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
  /* 道具擺在場景設定好的位置上（床上、桌上、地毯上…），每張畫會少擺幾個、位置也會偏一點 */
  const emos=mix(S.items), objs=[];
  S.plots.forEach((q,i)=>{
    if(r()<0.12) return;
    const y=clamp(q[1]+(r()*2-1)*2.5, 1, 102);
    objs.push({ e:emos[i%emos.length], x:clamp(q[0]+(r()*2-1)*3, -2, 102), y,
      s:q[2]*(0.85+r()*0.4), rot:r()*26-13, z:Math.round(y*2) });
  });
  /* 再灑一點小東西，畫面才熱鬧 */
  const extra=10+Math.floor(r()*8);
  const pool=mix(S.items);            /* 照順序輪流拿，同一個東西最多出現兩次 */
  for(let i=0;i<extra;i++){
    const x=2+r()*96, y=36+r()*62;
    objs.push({ e:pool[i%pool.length], x, y,
      s:3+Math.pow(y/100,1.9)*6.5, rot:r()*30-15, z:Math.round(y*2) });
  }
  objs.sort((p,q)=>p.y-q.y);
  /* 數字藏在場景指定的位置，而且用那個表面的顏色寫上去 */
  const spots=mix(S.spots), nums=[];
  const addAt=(sp,v,b)=>{
    const y=clamp(sp[1]+(r()*2-1)*2, 5, 95);
    nums.push({ v, b, x:clamp(sp[0]+(r()*2-1)*2.5, 5, 95), y, c:sp[2],
      z:Math.round(sp[1]*2)+1, s:4.6+r()*2.6, rot:r()*44-22, sk:r()*16-8, op:(0.62+r()*0.26).toFixed(2) });
  };
  for(let b=1;b<=ART_N;b++) addAt(spots[b-1], a.t*b, b);
  const used=new Set(nums.map(q=>q.v));
  const want=Math.min(spots.length, ART_N+ART_DECOY+Math.floor(r()*3));
  let i=ART_N, guard=0;
  while(nums.length<want && i<spots.length && guard++<90){
    const v=(2+Math.floor(r()*8))*(1+Math.floor(r()*9));
    if(used.has(v)) continue;
    used.add(v); addAt(spots[i++], v, 0);
  }
  return {S, objs, nums};
}
function artHTML(a, opt){
  const o=opt||{}, L=artLayout(a), S=L.S;
  const bg=`<svg class="scenery" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${S.bg}</svg>`;
  const objs=L.objs.map(x=>`<span class="aobj" aria-hidden="true"
    style="left:${x.x.toFixed(1)}%;top:${x.y.toFixed(1)}%;z-index:${x.z};--rot:${x.rot.toFixed(0)}deg;font-size:${x.s.toFixed(1)}cqw">${x.e}</span>`).join('');
  const nums=L.nums.filter(x=>!o.full || x.b>0).map(x=>{
    const st=`left:${x.x.toFixed(1)}%;top:${x.y.toFixed(1)}%;z-index:${x.z};--rot:${x.rot.toFixed(0)}deg;--sk:${x.sk.toFixed(0)}deg;--nc:${x.c};--op:${x.op};font-size:${x.s.toFixed(1)}cqw`;
    return o.full
      ? `<span class="anum on" aria-hidden="true" style="${st}">${x.v}</span>`
      : `<button class="anum" data-act="hfind" data-arg="${x.v}" data-b="${x.b}" aria-label="${x.v}" style="${st}">${x.v}</button>`;
  }).join('');
  return bg+objs+nums;
}
function startHunt(table){
  endGame();
  lastSetup={mode:'hunt', table};
  const art={ t:table, s:rnd(SCENES.length), k:Date.now()%1000000, d:todayStr() };
  game={mode:'hunt', table, art, order:shuffle([1,2,3,4,5,6,7,8,9]), pos:0, firstFind:0,
    combo:0, maxCombo:0, locked:false, miss:0, hinted:false, hints:0, t:null};
  go('hunt');
  huntNext();
}
function huntStrip(){
  const el=document.getElementById('hstrip'); if(!el) return;
  const done=new Set(game.order.slice(0,game.pos)), cur=game.order[game.pos];
  el.innerHTML=Array.from({length:ART_N},(_,i)=>{ const b=i+1;
    return `<i class="${done.has(b)?'ok':b===cur?'now':''}">${done.has(b)?'✓':'×'+b}</i>`;}).join('');
}
function huntNext(){
  if(!game || game.mode!=='hunt') return;
  if(game.pos>=ART_N) return finishHunt();
  game.locked=false; game.miss=0; game.hinted=false;
  const t=game.table, b=game.order[game.pos];
  $('#hask').innerHTML=`${t} <span class="op">×</span> ${b} <span class="op">=</span> ?<span class="hchant">答案藏在畫面裡，找到就點它</span>`;
  $('#qnum').textContent=`${b}/${ART_N}`;
  $('#trackfill').style.width=(game.pos/ART_N*100)+'%';
  hnote(game.pos===0 ? '數字跟畫面同色，仔細看每個角落' : `還剩 ${ART_N-game.pos} 個答案`);
  huntStrip();
}
function hnote(msg){ const el=document.getElementById('hnote'); if(el) el.textContent=msg; }
function artSplash(el){
  const art=document.getElementById('art'); if(!art || reduceMotion) return;
  const sp=document.createElement('span');
  sp.className='splash';
  sp.style.left=el.style.left; sp.style.top=el.style.top;
  sp.style.setProperty('--sp', '#FFD86B');
  art.appendChild(sp); setTimeout(()=>sp.remove(),1200);
}
function huntPick(v, el){
  if(!game || game.mode!=='hunt' || game.locked || !el || el.classList.contains('on')) return;
  const t=game.table, b=game.order[game.pos], ans=t*b, d=ensureDaily();
  if(v===ans){
    game.locked=true;
    const clean = game.miss===0 && !game.hinted;
    if(clean){
      record(t,b,true);
      game.firstFind++; game.combo++; game.maxCombo=Math.max(game.maxCombo,game.combo);
      d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,game.combo);
    }
    el.classList.remove('hintme'); el.classList.add('on'); el.disabled=true;
    artSplash(el);
    game.pos++;
    const ch=chant(t,b);
    $('#hask').innerHTML=`${t} <span class="op">×</span> ${b} <span class="op">=</span> ${ans}<span class="hchant ok">${ch}</span>`;
    hnote(clean ? PRAISE[rnd(PRAISE.length)] : '找到了！');
    sfx.right(game.combo); burstAt(el, game.combo>0&&game.combo%5===0?34:12);
    say(ch);
    huntStrip();
    save(); checkQuests();
    game.t=setTimeout(()=>{ if(game && game.mode==='hunt') huntNext(); }, reduceMotion?500:1200);
  } else {
    if(game.miss===0) record(t,b,false);
    game.miss++; game.combo=0;
    el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
    setTimeout(()=>el.classList.remove('bad'),520);
    sfx.wrong();
    const inTable = v%t===0 && v/t>=1 && v/t<=9;
    if(game.miss===1) hnote(inTable ? `那是 ${t} × ${v/t} = ${v} 喔，現在要找 ${t} × ${b}` : `${v} 不是 ${t} 的乘法喔`);
    else if(game.miss===2){ const ch=chant(t,b); hnote(`提示：${ch}`); say(ch); }
    else huntHint();
    save();
  }
}
function huntHint(){
  if(!game || game.mode!=='hunt' || game.locked) return;
  const ans=game.table*game.order[game.pos];
  const el=document.querySelector(`.anum[data-arg="${ans}"]:not(.on)`);
  if(!el) return;
  game.hinted=true; game.hints++;
  el.classList.remove('hintme'); void el.offsetWidth; el.classList.add('hintme');
  setTimeout(()=>el.classList.remove('hintme'), 2600);
  hnote(`答案是 ${ans}，看閃紅色的那個數字`);
  sfx.tap();
}
function finishHunt(){
  const d=ensureDaily(), m=me();
  const score=game.firstFind, total=ART_N, acc=score/total;
  const stars=acc>=.9?3:acc>=.7?2:1;
  m.stars+=stars;
  if(!Array.isArray(m.art)) m.art=[];
  m.art.unshift({t:game.art.t, s:game.art.s, k:game.art.k, d:todayStr()});
  if(m.art.length>MAX_ART) m.art.length=MAX_ART;
  d.p.rounds++; d.p.hunts++; d.p.tables[game.table]=true;
  if(score===total) d.p.perfect=1;
  markPlayed();
  document.querySelectorAll('.anum:not(.on)').forEach(n=>n.classList.add('fade'));
  game.result={timed:false, hunt:true, art:Object.assign({},game.art), score, total, stars,
    maxCombo:game.maxCombo, hints:game.hints, newBest:false};
  save(); checkQuests();
  clearTimeout(game.t);
  game.t=setTimeout(()=>{ if(game && game.result) go('result'); }, reduceMotion?400:1500);
}
function showArt(i){
  const list=me().art||[], a=list[i];

/* ---------- 複習模式 ---------- */
function startReview(table){

}
function flipCard(b){

function flipAll(open){

function setAutoBtn(){
