          <p class="hint">${me().coins>=DRAW_COST?'每次都會拿到還沒有的貼紙':`還差 ${DRAW_COST-me().coins} 枚金幣`}</p>
        </div>
      </section>
      ${groups}`;
  },

};

/* ---------- game ---------- */
function stageUnlocked(){ return true; }   /* 關卡全開，想練哪一張表都可以 */
function startStage(n){
  const S=STAGES[n-1];
  if(!S) return;
  endGame();
  lastSetup={mode:'stage', stage:n};
  let items=[];
  if(S.table){
    for(let b=1;b<=9;b++) items.push({a:S.table, b});   /* 選 5 的乘法就全部寫成 5 × b */
    shuffle(items);
    let worst=2+rnd(8), ww=-1;
    for(let b=2;b<=9;b++){ const w=weightOf(S.table,b)+Math.random(); if(w>ww){ww=w;worst=b;} }
    items.push({a:S.table,b:worst});
    items=items.slice(0,S.q);
  } else {
    const pairs=[]; for(let a=2;a<=9;a++) for(let b=2;b<=9;b++){ const w=weightOf(a,b); pairs.push({a,b,w:S.weak?w*w:w}); }
    const used=new Set();
    while(items.length<S.q){
      const pool=pairs.filter(p=>!used.has(key(p.a,p.b)));
      if(!pool.length) break;
      let sum=pool.reduce((s,p)=>s+p.w,0), r=Math.random()*sum;
      const p=pool.find(p=>(r-=p.w)<=0)||pool[0];
      used.add(key(p.a,p.b)); items.push({a:p.a,b:p.b});
    }
  }
  game={mode:'stage', stage:n, table:S.table, input:state.settings.input, queue:items, total:items.length, pos:0,
    firstCorrect:0, combo:0, maxCombo:0, typed:'', locked:false, waiting:false, t:null};
  go('play'); nextQ();
}
function finishStage(){
  const d=ensureDaily(), m=me(), S=STAGES[game.stage-1];
  const score=game.firstCorrect, total=game.total, need=Math.ceil(total*0.8);
  const cleared=score>=need;
  const grade = score===total?3 : score>=total-1?2 : (cleared?1:0);
  const prev=m.stages[game.stage], firstClear=cleared && !prev;
  let coins=0, capped=false;
  if(cleared){
    if(firstClear){
      const room = Math.max(0, STAGE_FIRST_CAP - d.p.firstCoins);
      coins = Math.min(grade===3?2:1, room);
      if(!coins) capped = true;
      d.p.firstCoins += coins;
    }
    else if(d.p.stageCoins<STAGE_COIN_CAP){ coins = 1; d.p.stageCoins += coins; }
    else capped = true;
    if(coins) m.coins += coins;
    m.stages[game.stage]={cleared:true, best:Math.max(grade, prev?prev.best:0)};
    d.p.stagesCleared++;
  }
  d.p.rounds++;
  if(S.table) d.p.tables[S.table]=true; else d.p.mix++;
  if(score===total) d.p.perfect=1;
  markPlayed();
  game.result={timed:false, stage:game.stage, cleared, firstClear, coins, capped, need, hard:true,
    score, total, grade, maxCombo:game.maxCombo, newBest:false};
  save(); checkQuests();
  clearTimeout(game.t);
  go('result');
}
function startTimed(){
  endGame();
  lastSetup={mode:'timed'};
  game={mode:'timed', input:state.settings.input, score:0, combo:0, maxCombo:0, typed:'', locked:false, waiting:false,
    timeLeft:60, timer:null, t:null, last:null};
  go('play'); nextQ();
  const f0=$('#trackfill');
  if(f0){ f0.style.transition='none'; f0.style.width='100%';
          requestAnimationFrame(()=>{ if(f0) f0.style.transition=''; }); }
  game.timer=setInterval(()=>{
    if(!game) return;
    if(document.getElementById('modal')) return;   /* 說明／確認彈窗打開時，時間先停住 */
    game.timeLeft--;
    updateTimeBar();
    if(game.timeLeft<=0) finishTimed();
  },1000);
}
function endGame(){
  if(game){ clearInterval(game.timer); clearTimeout(game.t); clearTimeout(game.badT); }
  game=null;
}
function updateTimeBar(){
  const f=$('#trackfill'), tr=$('#track'), bt=$('#bigtime');
  if(f) f.style.width=(game.timeLeft/60*100)+'%';
  if(tr) tr.classList.toggle('low', game.timeLeft<=10);
  if(bt) bt.textContent=game.timeLeft+' 秒';
}
function nextQ(){
  if(!game) return;
  if(game.mode!=='timed' && game.pos>=game.queue.length) return finishRound();
  let it;
  if(game.mode!=='timed') it=game.queue[game.pos];
  else {
    do{ const a=2+rnd(8), b=2+rnd(8); it={a,b}; } while(game.last && key(it.a,it.b)===game.last);
    game.last=key(it.a,it.b);
  }
  game.cur=it; game.typed=''; game.locked=false; game.waiting=false;
  $('#qa').textContent=it.a; $('#qb').textContent=it.b;
  const slot=$('#slot'); slot.textContent='?'; slot.classList.remove('typed');
  $('#fb').innerHTML='';
  const qc=$('#qcard'); qc.className='qcard'; void qc.offsetWidth; qc.classList.add('enter');
  if(game.mode!=='timed'){
    $('#trackfill').style.width=(game.pos/game.queue.length*100)+'%';
    $('#qnum').textContent=`${Math.min(game.pos+1,game.queue.length)}/${game.queue.length}`;
  } else {
    $('#qnum').innerHTML=`${ic('check')} ${game.score}`;
    updateTimeBar();
  }
  renderInput();
  updateCombo(false);
}
function renderInput(){
  const area=$('#inputArea');
  if(game.input==='choice'){
    const {a,b}=game.cur, ans=a*b;
    const cand=new Set();
    [a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+10,ans-10,(a+1)*(b-1)].forEach(v=>{ if(v>0&&v!==ans&&v<=90) cand.add(v); });
    const opts=shuffle([...cand]).slice(0,3); opts.push(ans); shuffle(opts);
    area.innerHTML=`<div class="choices">${opts.map((o,i)=>`<button class="choice c${i}" data-act="choice" data-arg="${o}">${o}</button>`).join('')}</div>`;
  } else if(!area.querySelector('.pad')){

      <button class="key" data-act="key" data-arg="0">0</button>

}
function updateCombo(pulse){
  const c=$('#combo'); if(!c) return;
  if(game.combo>=2){ c.innerHTML=`<span class="${pulse?'pulse':''}">${ic('fire')} 連續答對 ${game.combo} 題</span>`; }

}
function pressKey(k){
  if(!game) return;
  if(game.locked){ if(k==='ok' && game.waiting) advance(); return; }
  if(k==='del'){ game.typed=game.typed.slice(0,-1); }
  else if(k==='ok'){ if(game.typed) submit(+game.typed); return; }
  else if(game.typed.length<2){ game.typed=(game.typed==='0'?'':game.typed)+k; }
  sfx.tap();
  const slot=$('#slot'); slot.textContent=game.typed||'?'; slot.classList.toggle('typed',!!game.typed);
}
function submit(val){
  if(!game || game.locked) return;
  game.locked=true;
  const it=game.cur, ans=it.a*it.b, ok=val===ans;
  const d=ensureDaily();
  if(!it.retry) record(it.a,it.b,ok);   /* 答錯重來的那一次不算熟練度 */
  const qc=$('#qcard'), slot=$('#slot'), fb=$('#fb');
  qc.classList.remove('enter');
  if(ok){
    game.combo++; game.maxCombo=Math.max(game.maxCombo,game.combo);
    d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,game.combo);
    if(game.mode!=='timed'){ if(!it.retry) game.firstCorrect++; } else { game.score++; $('#qnum').innerHTML=`${ic('check')} ${game.score}`; }
    slot.textContent=ans; qc.classList.add('right');
    const msg = game.combo>0 && game.combo%5===0 ? `連續 ${game.combo} 題，火力全開！` : PRAISE[rnd(PRAISE.length)];
    fb.innerHTML=`<div class="praise">${msg}</div><div class="chant">${chant(it.a,it.b)}</div>`;
    sfx.right(game.combo);
    say(chant(it.a,it.b));   /* 答完就唸一次口訣：2×2 唸「二二得四」 */
    floaty(slot,'+1');
    if(game.combo%5===0){ burstAt(slot,36); sfx.fanfare(); } else burstAt(slot,10);
    updateCombo(true);
    game.t=setTimeout(advance, game.mode==='timed'?550:1000);
  } else {
    game.combo=0;
    slot.innerHTML=`<s>${val}</s>${ans}`; qc.classList.add('wrong');
    const ch=chant(it.a,it.b);
    let html=`<div class="wrongmsg">慢慢來，答案是 <b>${ans}</b></div><div class="chant">${ch}${canSpeak?`<button class="say" data-act="say" data-arg="${ch}" aria-label="唸口訣">🔊</button>`:''}</div>`;
    if(game.mode!=='timed'){
      if(!it.retry){ game.queue.push({a:it.a,b:it.b,retry:true}); html+='<div class="retrynote">這題等一下會再出現一次</div>'; }
      fb.innerHTML=html;
      $('#inputArea').innerHTML='<div class="nextwrap"><button class="btn big sun" data-act="next">下一題</button></div>';
      game.waiting=true;
      setTimeout(()=>{ const b=document.querySelector('[data-act="next"]'); if(b) b.focus(); },50);
    } else {
      fb.innerHTML=html;
      game.t=setTimeout(advance,1500);
    }
    sfx.wrong();
    say(ch);                 /* 答錯也要唸，順便把正確的記起來 */
    updateCombo(false);
  }
  save(); checkQuests();
}
function advance(){
  if(!game) return;
  clearTimeout(game.t);
  if(game.mode!=='timed') game.pos++;
  if(game.mode!=='timed' && game.input==='type' && !document.querySelector('#inputArea .pad')) $('#inputArea').innerHTML='';
  nextQ();
}
function finishRound(){
  if(game.mode==='stage') return finishStage();
  const d=ensureDaily();
  const score=game.firstCorrect, total=game.total, acc=score/total;
  const grade=acc>=.9?3:acc>=.7?2:1;
  d.p.rounds++;
  if(game.table) d.p.tables[game.table]=true; else d.p.mix++;
  if(score===total) d.p.perfect=1;
  markPlayed();
  game.result={timed:false, hard:true, score, total, grade, maxCombo:game.maxCombo, newBest:false};
  save(); checkQuests();
  clearTimeout(game.t);
  go('result');
}
function finishTimed(){
  if(!game) return;
  clearInterval(game.timer); clearTimeout(game.t);
  const d=ensureDaily(), score=game.score;
  const grade=score>=15?3:score>=8?2:1;
  const m=me();
  const newBest=score>m.timedBest && score>0;
  if(newBest) m.timedBest=score;
  let coins=0;                       /* 答對 20 題以上給 1 枚，每天只給一次 */
  if(score>=TIMED_GOAL && !d.p.timedCoins){ coins=1; d.p.timedCoins=1; m.coins+=1; }
  d.p.timedBest=Math.max(d.p.timedBest,score);
  markPlayed();
  game.result={timed:true, hard:true, score, grade, coins, maxCombo:game.maxCombo, newBest};
  game.locked=true;
  save(); checkQuests();
  go('result'); if(coins) coinDoneCheck();
}

/* 點攤位：看這一攤的三個任務 */
function openTier(tier){
  const d=ensureDaily(), t=d&&d.tiers[tier], T=TIER_BY[tier];
  if(!t || !T) return;
  const rows=t.quests.map((q,i)=>{
    const pr=Math.min(progressOf(q),q.target), done=pr>=q.target, cap=Math.min(q.target,12);
    let dots='';
    for(let k=0;k<cap;k++) dots+=`<i class="${k < Math.round(pr/q.target*cap) ? 'on':''}"></i>`;
    let foot;
    if(t.claimed[i]) foot=`<span class="qgo">${ic('check')} 領過了</span>`;
    else if(done) foot=`<button class="btn small sage" data-act="claim" data-arg="${tier}:${i}">拿 ${ic('coin')} 1 枚</button>`;
    else foot=`<span class="qgo">還差 ${q.target-pr}</span>`;
    return `<li class="qrow ${done?'ok':''}"><span class="qn">${ic(QUEST_ICON[q.type]||'flag')} ${questText(q)}
      <span class="qd" aria-label="${pr}／${q.target}">${dots}</span></span>${foot}</li>`;
  }).join('');
  let bonus;
  if(t.bonus) bonus=`<span>${ic('gift')} 今天的${T.name}獎勵拿過了，明天再來！</span>`;
  else if(t.claimed.every(Boolean)) bonus=`<span>${ic('gift')} <b>三個都完成了！</b></span><button class="btn small sun" data-act="bonus" data-arg="${tier}">再拿 ${T.bonus} 枚</button>`;
  else bonus=`<span>${ic('gift')} 三個都完成，再送 ${T.bonus} 枚金幣</span>`;
  showModal(`<h3>${ic(T.icon)} ${T.name}</h3>
    <p class="tdesc" style="text-align:center;margin:4px 0 10px">${mk(T.desc)}</p>
    <ul class="qlist">${rows}</ul>
    <div class="bonus">${bonus}</div>
    <div class="row" style="margin-top:14px"><button class="btn sun big" data-act="closeModal">知道了！</button></div>`);
}
function coinsLeftToday(){
  const d=ensureDaily();
  if(!d) return 0;
  let left=0;
  TIERS.forEach(T=>{
    const t=d.tiers[T.id];
    if(!t){ left += TIER_QUESTS[T.id].length + T.bonus; return; }
    t.claimed.forEach(c=>{ if(!c) left++; });
    if(!t.bonus) left += T.bonus;
  });
  const mm=me(), unc=STAGES.filter(S=>!(mm.stages||{})[S.n]).length;   /* 關卡全破就沒有首次通關的金幣了 */
  left += Math.min(unc*2, Math.max(0, STAGE_FIRST_CAP - d.p.firstCoins));   /* 一關一次全對可以拿 2 枚 */
  left += Math.max(0, STAGE_COIN_CAP  - d.p.stageCoins);
  if(!d.p.timedCoins) left += 1;
  return left;
}

/* ---------- 彩虹貪食蛇 ---------- */
let snakeLvId = 'e';
function snakeLv(){ return SNAKE_BY[snakeLvId] || SNAKE_LV[0]; }
function startSnake(table, lvId){
  endGame();
  snakeLvId = SNAKE_BY[lvId] ? lvId : snakeLvId;
  const lv = snakeLv(), n = lv.size, mid = Math.floor(n/2);
  lastSetup = {mode:'snake', table, lv:lv.id};
  game = { mode:'snake', table, lv, n,
    snake:[{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}],
    dir:{x:1,y:0}, nextDir:{x:1,y:0},
    hearts:lv.hearts, eaten:0, rainbows:0, combo:0, maxCombo:0,
    qi:0, cur:null, items:[], rocks:[], ms:lv.ms, paused:false, over:false, timer:null, t:null };

  if(!lv.step) snakeRun();

function snakeRun(){
  clearInterval(game.timer);
  game.timer = setInterval(()=>{
    if(!game || game.mode!=='snake') return;
    if(currentView!=='snake'){ endGame(); return; }
    if(document.getElementById('modal')) return;   /* 彈窗打開時蛇先不要動 */
    if(game.paused || game.over) return;
    snakeStep();
  }, game.ms);
}
function snakeQuestion(){
  const t = game.table;
  if(t){
    if(game.lv.seq){ const b=(game.qi%9)+1; game.qi++; return {a:t, b}; }
    let b; do{ b = 1+rnd(9); } while(game.cur && b===game.cur.b);
    return {a:t, b};
  }
  const pairs=[]; for(let a=2;a<=9;a++) for(let b=2;b<=9;b++) pairs.push({a,b,w:weightOf(a,b)});
  let sum=pairs.reduce((s,q)=>s+q.w,0), r=Math.random()*sum;
  const q=pairs.find(q=>(r-=q.w)<=0)||pairs[0];
  return {a:q.a, b:q.b};
}
function snakeDecoys(ans,a,b,k){
  const set=new Set();
  const cand=shuffle([a*(b+1), a*(b-1), (a+1)*b, (a-1)*b, ans+1, ans-1, ans+2, ans-2, ans+10, ans-10, b*b, a*a]);
  for(const v of cand){ if(set.size>=k) break; if(v>0 && v<100 && v!==ans) set.add(v); }
  while(set.size<k){ const v=1+rnd(81); if(v!==ans) set.add(v); }
  return [...set];
}
function snakeFree(){
  const g=game, h=g.snake[0];
  for(let i=0;i<400;i++){
    const x=rnd(g.n), y=rnd(g.n);
    if(g.snake.some(s=>s.x===x&&s.y===y)) continue;
    if(g.items.some(s=>s.x===x&&s.y===y)) continue;
    if(g.rocks.some(s=>s.x===x&&s.y===y)) continue;
    if(Math.abs(h.x-x)+Math.abs(h.y-y)<3) continue;
    return {x,y};
  }
  return null;
}
function snakeNextQ(){
  const g=game;
  g.cur = snakeQuestion();
  const ans = g.cur.a*g.cur.b;
  g.items = [];
  const vals = shuffle([{v:ans, ok:true}].concat(
    snakeDecoys(ans, g.cur.a, g.cur.b, g.lv.decoys).map(v=>({v, ok:false}))));
  vals.forEach(it=>{ const c=snakeFree(); if(c) g.items.push({x:c.x, y:c.y, v:it.v, ok:it.ok}); });
  updateSnakeBar();
}
function snakeDir(k){
  const g=game;
  if(!g || g.mode!=='snake' || g.over) return;
  const d = {u:{x:0,y:-1}, d:{x:0,y:1}, l:{x:-1,y:0}, r:{x:1,y:0}}[k];
  if(!d) return;
  if(g.snake.length>1 && d.x===-g.dir.x && d.y===-g.dir.y) return;   /* 不能直接迴轉 */
  g.nextDir = d;
  if(g.paused){ g.paused=false; snakeNote(''); }
  if(g.lv.step){ sfx.tap(); snakeStep(); }
}
function snakePause(){
  const g=game;
  if(!g || g.mode!=='snake' || g.over || g.lv.step) return;
  g.paused = !g.paused;
  snakeNote(g.paused ? '暫停中，慢慢算，按方向鍵繼續' : '');
  const b=document.querySelector('[data-act="spause"]');
  if(b) b.innerHTML = ic(g.paused ? 'play' : 'pause');
}
function snakeStep(){
  const g=game, n=g.n;
  g.dir = g.nextDir;
  const h=g.snake[0];
  const nx=(h.x+g.dir.x+n)%n, ny=(h.y+g.dir.y+n)%n;
  if(g.snake.some((sg,i)=> i<g.snake.length-1 && sg.x===nx && sg.y===ny)){
    g.paused = true;
    g.snake.length = Math.max(3, g.snake.length-2);
    snakeHurt('蛇打結了！換個方向再出發');
    paintSnake();
    return;
  }
  const ri = g.rocks.findIndex(r=>r.x===nx && r.y===ny);
  if(ri>=0){
    g.rocks.splice(ri,1);
    g.snake.length = Math.max(3, g.snake.length-1);
    snakeHurt('撞到石頭了！');
    paintSnake();
    return;
  }
  const ii = g.items.findIndex(it=>it.x===nx && it.y===ny);
  g.snake.unshift({x:nx, y:ny});
  if(ii>=0){
    const it=g.items[ii];
    if(it.ok){ snakeEat(); }
    else { g.items.splice(ii,1); g.snake.pop(); snakeMiss(it.v); }
  } else {
    g.snake.pop();
  }
  if(!g.over) paintSnake();
}
function snakeEat(){
  const g=game, a=g.cur.a, b=g.cur.b, d=ensureDaily();
  record(a,b,true);
  g.eaten++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);   /* 吃一個，整條蛇的彩虹就轉一格 */
  d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,g.combo);
  sfx.right(g.combo); say(chant(a,b));
  snakeNote(`${chant(a,b)}　${PRAISE[rnd(PRAISE.length)]}`);
  const head=document.querySelector('.snhead');
  if(head) burstAt(head, 10);
  if(g.eaten % RAINBOW.length === 0){
    g.rainbows++; d.p.rainbows++;
    sfx.fanfare(); toast(`完成第 ${g.rainbows} 條彩虹！${g.rainbows>=2?'':'再一條就過關'}`);
    if(head) burstAt(head, 40);
    if(g.lv.up && g.ms>g.lv.min){ g.ms=Math.max(g.lv.min, g.ms-g.lv.up); snakeRun(); }
    if(g.lv.rocks) for(let i=0;i<2;i++){ const c=snakeFree(); if(c) g.rocks.push(c); }
  }
  if(g.eaten>=SNAKE_WIN){          /* 兩條彩虹就放煙火收工，不用玩到沒愛心 */
    g.win=true;
    paintSnake();
    snakeNote('兩條彩虹集滿了，過關！');
    fireworks();
    finishSnake();
    return;
  }

}
function snakeMiss(v){

/* 整條蛇就是一條彩虹：頭固定紅色，往後照紅橙黃綠藍靛紫排下去，長過七節就再循環 */

const SDIR = {u:[0,-1], d:[0,1], l:[-1,0], r:[1,0]};
/* 點盤面上任何一格（最直覺的就是點蛇頭前面那一格），蛇就往那個方向轉 */
function snakeTapTo(cx, cy){
  const g=game;
  if(!g || g.mode!=='snake' || g.over) return;
  const n=g.n, h=g.snake[0];
  let dx=cx-h.x, dy=cy-h.y;
  if(dx> n/2) dx-=n; if(dx< -n/2) dx+=n;        /* 盤面四邊是接起來的，走近路 */
  if(dy> n/2) dy-=n; if(dy< -n/2) dy+=n;
  if(!dx && !dy) return;
  const cand = Math.abs(dx)>=Math.abs(dy)
    ? [dx>0?'r':'l', dy>0?'d':'u']
    : [dy>0?'d':'u', dx>0?'r':'l'];
  for(const k of cand){
    if(!dx && (k==='r'||k==='l')) continue;
    if(!dy && (k==='u'||k==='d')) continue;
    if(SDIR[k][0]===-g.dir.x && SDIR[k][1]===-g.dir.y) continue;   /* 不能直接迴轉 */
    snakeDir(k); return;
  }
}
function bindSwipe(){
  const b=document.getElementById('snboard');
  if(!b) return;
  let sx=0, sy=0, on=false, swiped=0;
  b.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; on=true; }, {passive:true});
  b.addEventListener('touchmove', e=>{
    if(!on) return;
    const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<22 && Math.abs(dy)<22) return;
    on=false; swiped=Date.now();
    snakeDir(Math.abs(dx)>Math.abs(dy) ? (dx>0?'r':'l') : (dy>0?'d':'u'));
  }, {passive:true});
  b.addEventListener('touchend', ()=>{ on=false; }, {passive:true});
  b.addEventListener('click', e=>{
    if(Date.now()-swiped < 500) return;          /* 剛剛滑過了，不要又轉一次 */
    const g=game;
    if(!g || g.mode!=='snake' || g.over) return;
    const r=b.getBoundingClientRect();
    if(!r.width || !r.height) return;
    snakeTapTo(Math.floor((e.clientX-r.left)/r.width*g.n), Math.floor((e.clientY-r.top)/r.height*g.n));
  });
}
function finishSnake(){

/* ---------- 尋寶模式：數字融進完整場景裡，隨機出題，找到就圈起來 ---------- */
/* 一張畫只存 {乘法表, 場景, 亂數種子, 日期}，畫面都用種子重新算出來，所以畫廊能永遠重現同一張 */
function artRand(a){ return seeded('mul99art#'+a.t+'#'+a.s+'#'+a.k); }
/* table 0 = 綜合挑戰：九題從 2~9 的乘法裡隨機挑，不重複（交換律算同一題）*/
function mixPairs(rand){
  const out=[], used=new Set();
  let guard=0;
  while(out.length<ART_N && guard++<400){
    const x=2+Math.floor(rand()*8), y=2+Math.floor(rand()*8);
    const k=Math.min(x,y)+'x'+Math.max(x,y);
    if(used.has(k)) continue;
    used.add(k); out.push({a:x, b:y});
  }
  while(out.length<ART_N) out.push({a:2+out.length%8, b:3});
  return out;
}
/* 一張畫要藏的九題：指定乘法表就是 t×1~9，綜合挑戰則由同一顆種子決定，
   所以同一張畫重看、收進畫廊，題目都一樣 */
function artPairs(a){
  if(a.t) return Array.from({length:ART_N}, (_,i)=>({a:a.t, b:i+1}));
  return mixPairs(seeded('mul99mix#'+a.s+'#'+a.k));
}
const tableName = t => t ? `${t} 的乘法` : '綜合挑戰';
function artScene(a){ return SCENES[((a.s%SCENES.length)+SCENES.length)%SCENES.length]; }
function artLayout(a){
  const r=artRand(a), S=artScene(a);
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const mix=arr=>{ const b=arr.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
  /* 道具擺在場景設定好的位置上（床上、桌上、地毯上…），每張畫會少擺幾個、位置也會偏一點 */
  const emos=mix(S.items), objs=[];
  S.plots.forEach((q,i)=>{
    if(r()<0.12) return;
    const y=clamp(q[1]+(r()*2-1)*2.5, 1, 102);
    objs.push({ e:emos[i%emos.length], x:clamp(q[0]+(r()*2-1)*3, -2, 102), y,
      s:q[2]*(0.85+r()*0.4), rot:r()*26-13, z:Math.round(y*2) });
  });
  /* 再灑一點小東西，畫面才熱鬧 */
  const extra=10+Math.floor(r()*8);
  const pool=mix(S.items);            /* 照順序輪流拿，同一個東西最多出現兩次 */
  for(let i=0;i<extra;i++){
    const x=2+r()*96, y=36+r()*62;
    objs.push({ e:pool[i%pool.length], x, y,
      s:3+Math.pow(y/100,1.9)*6.5, rot:r()*30-15, z:Math.round(y*2) });
  }
  objs.sort((p,q)=>p.y-q.y);
  /* 數字藏在場景指定的位置，而且用那個表面的顏色寫上去 */
  const spots=mix(S.spots), nums=[];
  const addAt=(sp,v,b)=>{
    const y=clamp(sp[1]+(r()*2-1)*2, 5, 95);
    nums.push({ v, b, x:clamp(sp[0]+(r()*2-1)*2.5, 5, 95), y, c:sp[2],
      z:Math.round(sp[1]*2)+1, s:4.6+r()*2.6, rot:r()*44-22, sk:r()*16-8, op:(0.62+r()*0.26).toFixed(2) });
  };
  const pairs=artPairs(a);
  for(let b=1;b<=ART_N;b++) addAt(spots[b-1], pairs[b-1].a*pairs[b-1].b, b);
  const used=new Set(nums.map(q=>q.v));
  const want=Math.min(spots.length, ART_N+ART_DECOY+Math.floor(r()*3));
  let i=ART_N, guard=0;
  while(nums.length<want && i<spots.length && guard++<90){
    const v=(2+Math.floor(r()*8))*(1+Math.floor(r()*9));
    if(used.has(v)) continue;
    used.add(v); addAt(spots[i++], v, 0);
  }
  return {S, objs, nums};
}
function artHTML(a, opt){
  const o=opt||{}, L=artLayout(a), S=L.S;
  const bg=`<svg class="scenery" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${S.bg}</svg>`;
  const objs=L.objs.map(x=>`<span class="aobj" aria-hidden="true"
    style="left:${x.x.toFixed(1)}%;top:${x.y.toFixed(1)}%;z-index:${x.z};--rot:${x.rot.toFixed(0)}deg;font-size:${x.s.toFixed(1)}cqw">${art(x.e)}</span>`).join('');
  const nums=L.nums.filter(x=>!o.full || x.b>0).map(x=>{
    const st=`left:${x.x.toFixed(1)}%;top:${x.y.toFixed(1)}%;z-index:${x.z};--rot:${x.rot.toFixed(0)}deg;--sk:${x.sk.toFixed(0)}deg;--nc:${x.c};--op:${x.op};font-size:${x.s.toFixed(1)}cqw`;

  }).join('');
  return bg+objs+nums;
}

function artSplash(el){

function huntPick(v, el){

  const slot=game.order[game.pos], p=game.pairs[slot-1];

    game.locked=true;
    const clean = game.miss===0 && !game.hinted;
    if(clean){
      record(t,b,true);

      d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,game.combo);

    hnote(clean ? PRAISE[rnd(PRAISE.length)] : '找到了！');

function huntHint(){

/* ---------- 認識乘法 ---------- */
function learnQ(){
  const hi = (game && game.qi<3) ? 5 : 9;
  let a,b,guard=0;
  do{ a=2+rnd(hi-1); b=2+rnd(hi-1); guard++; }
  while(guard<30 && game && game.cur && a===game.cur.a && b===game.cur.b);
  return {a, b, emo:LEARN_EMO[rnd(LEARN_EMO.length)]};
}
function startLearn(){
  endGame();
  lastSetup={mode:'learn'};
  game={mode:'learn', qi:0, total:LEARN_N, first:0, combo:0, maxCombo:0,
        cur:null, pick:[], miss:0, hinted:false, hint:0, locked:false, t:null};
  game.cur=learnQ();
  go('learn');
}
function lnote(msg){ const el=document.getElementById('lnote'); if(el) el.textContent=msg; }
function lfb(html){ const el=document.getElementById('lfb'); if(el) el.innerHTML=html; }
function learnNext(){
  if(!game || game.mode!=='learn') return;
  if(game.qi>=game.total) return finishLearn();
  game.cur=learnQ(); game.pick=[]; game.miss=0; game.hinted=false; game.locked=false;
  go('learn');
}
function learnSlot(i){
  const g=game; if(!g || g.mode!=='learn' || g.locked) return;
  g.pick=g.pick.slice(0,+i); sfx.tap(); go('learn');
}
/* 一格一格驗：被乘數（每排幾個）填對了，才輪到乘數（有幾排） */
function learnKey(k){
  const g=game; if(!g || g.mode!=='learn' || g.locked) return;
  sfx.tap();
  if(k==='del'){ if(g.pick.length) g.pick.pop(); go('learn'); return; }
  if(g.pick.length>=2) return;
  const q=g.cur, v=+k;
  if(g.pick.length===0){
    if(v!==q.b) return learnBad(0,v);
    g.pick.push(v); g.hint=0;      /* 填對了提示就收起來，要再按才會出現 */
    go('learn');
    lnote('對了！再數數看總共有幾排');
    return;
  }
  if(v!==q.a) return learnBad(1,v);
  g.pick.push(v); g.hint=0;
  learnCheck();
}
function learnBad(slot,v){
  const g=game, q=g.cur;
  if(g.miss===0) record(q.a,q.b,false);
  g.miss++; g.combo=0; g.hinted=true;
  go('learn');
  const box=document.getElementById('lbox');
  if(box){ box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad'); }
  lfb(`<div class="lwrong">${ic('close')} 慢慢來，再數一次</div>`);
  lnote(slot===0 ? '一排有幾個呢？一個一個數數看' : '總共有幾排呢？一排一排數數看');
  sfx.wrong();
}
/* 提示跟著現在在填哪一格走：
   還在填「每排幾個」→ 一直都是「這一排有 X 個喔！」；填「有幾排」→ 才跳紅色排號 */
function learnHint(){
  const g=game; if(!g || g.mode!=='learn' || g.locked) return;
  const q=g.cur;

    g.hint = 1;

}
/* 兩格都填對才會走到這裡 */
function learnCheck(){
  const g=game, q=g.cur, x=g.pick[0], y=g.pick[1], d=ensureDaily();
  g.locked=true;
  const clean = g.miss===0 && !g.hinted;

    g.first++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);
    d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,g.combo);

  sfx.right(g.combo);

function finishLearn(){

/* ---------- 配對消消樂 ---------- */
let pairLvId='e', pairStyle='same';
function pairLv(){ return PAIR_BY[pairLvId] || PAIR_LV[0]; }
function pairExprs(p, lo, hi){
  const out=[];
  for(let a=lo;a<=hi;a++){ if(p%a===0){ const b=p/a; if(b>=lo && b<=hi) out.push([a,b]); } }
  return out;
}
function pairProducts(lo, hi, min){
  const seen={}, out=[];
  for(let a=lo;a<=hi;a++) for(let b=lo;b<=hi;b++){
    const p=a*b;
    if(!seen[p]){ seen[p]=1; if(pairExprs(p,lo,hi).length>=min) out.push(p); }
  }
  return out;
}
/* 有兩種以上「不同寫法」的答案（16 = 4x4 = 8x2），這種最能看出乘法的規律 */
function pairRich(p, lo, hi){
  const seen={}; let k=0;
  pairExprs(p,lo,hi).forEach(e=>{ const x=Math.min(e[0],e[1])+'x'+Math.max(e[0],e[1]); if(!seen[x]){ seen[x]=1; k++; } });
  return k>=2;
}
/* 一半挑這種答案，一半挑交換律（3x4 / 4x3），兩種規律都能練到。
   每一局至少保證有一組是「寫法完全不同」的（24 = 3x8 = 4x6），不會整局都只是交換律 */
function pairPool(lo, hi, n){
  const all=pairProducts(lo,hi,2);
  const rich=shuffle(all.filter(p=>pairRich(p,lo,hi)));
  const plain=shuffle(all.filter(p=>!pairRich(p,lo,hi)));
  const want=Math.max(1, Math.min(rich.length, Math.ceil(n/2)));
  const out=rich.slice(0,want).concat(plain, rich.slice(want)).slice(0,n);
  if(rich.length && !out.some(p=>pairRich(p,lo,hi))) out[0]=rich[0];   /* 保險：一定留一組 */
  return shuffle(out);
}
/* 同一個答案挑兩個「不同寫法」的算式，優先挑 4x4 / 8x2 這種，沒有才用 3x4 / 4x3 */
function twoExprs(p, lo, hi){
  const ex=shuffle(pairExprs(p,lo,hi)), uniq=[], seen={};
  ex.forEach(e=>{ const k=Math.min(e[0],e[1])+'x'+Math.max(e[0],e[1]); if(!seen[k]){ seen[k]=1; uniq.push(e); } });
  return uniq.length>=2 ? [uniq[0],uniq[1]] : ex.slice(0,2);
}
/* 「寫法完全不同」的配對（不是把算式倒過來寫），每一局固定佔一半 */
const PAIR_RICH = [
  {p:4,  e:[[4,1],[2,2]]}, {p:6,  e:[[6,1],[2,3]]}, {p:8,  e:[[8,1],[2,4]]},
  {p:9,  e:[[9,1],[3,3]]}, {p:12, e:[[2,6],[3,4]]}, {p:16, e:[[2,8],[4,4]]},
  {p:18, e:[[2,9],[3,6]]}, {p:24, e:[[3,8],[4,6]]}, {p:36, e:[[4,9],[6,6]]}
];
function pairGroups(lv){
  const hi=lv.hi, n=lv.pairs;
  const rich=shuffle(PAIR_RICH.filter(r=>r.e.every(e=>e[0]<=hi && e[1]<=hi)));
  const want=Math.min(rich.length, Math.round(n/2));
  const cp=r=>({p:r.p, e:[r.e[0].slice(), r.e[1].slice()]});
  const out=rich.slice(0,want).map(cp), used=new Set(out.map(x=>x.p));
  const plain=[];                       /* 其餘用交換律：3×4 和 4×3 */
  for(let a=2;a<=hi;a++) for(let b=a+1;b<=hi;b++){
    const pr=a*b;
    if(!used.has(pr)) plain.push({p:pr, e:[[a,b],[b,a]]});
  }
  shuffle(plain);
  for(const q of plain){
    if(out.length>=n) break;
    if(used.has(q.p)) continue;
    used.add(q.p); out.push(q);
  }
  for(const r of rich.slice(want)){     /* 真的湊不滿才再拿 */
    if(out.length>=n) break;
    if(used.has(r.p)) continue;
    used.add(r.p); out.push(cp(r));
  }
  return shuffle(out).slice(0,n);
}
function pairDeck(lv){
  const out=[];
  pairGroups(lv).forEach((q,i)=>{
    const e = Math.random()<.5 ? q.e : [q.e[1], q.e[0]];
    out.push({a:e[0][0], b:e[0][1], p:q.p, g:i, ok:false, tried:false, bad:false, fresh:false},
             {a:e[1][0], b:e[1][1], p:q.p, g:i, ok:false, tried:false, bad:false, fresh:false});
  });
  return shuffle(out);
}
/* 找不同：每張卡有兩個算式，只有一張的兩邊答案不一樣 */
function diffRound(lv){
  const lo=2, hi=lv.hi, n=Math.max(2,lv.cards);
  const ps=pairPool(lo,hi,n);
  const cards=[];
  for(let i=0;i<n-1;i++){
    const p=ps[i%ps.length], two=twoExprs(p,lo,hi);
    cards.push({l:two[0], r:two[1], bad:false, tried:false, found:false});
  }
  const p=ps[(n-1)%ps.length], ex=shuffle(pairExprs(p,lo,hi)), l=ex[0];
  let r=null, guard=0;
  while(!r && guard++<60){
    const base=ex[ex.length>1?1:0];
    const d=rnd(2)?1:-1, w=rnd(2);
    const a=w?base[0]+d:base[0], b=w?base[1]:base[1]+d;
    if(a>=lo && a<=hi && b>=lo && b<=hi && a*b!==p) r=[a,b];
  }
  if(!r){ let a,b; do{ a=lo+rnd(hi-lo+1); b=lo+rnd(hi-lo+1); }while(a*b===p); r=[a,b]; }
  cards.push({l, r, bad:true, tried:false, found:false});
  return shuffle(cards);
}
function startPair(style, lvId){
  endGame();
  if(style) pairStyle = style==='diff' ? 'diff' : 'same';
  if(lvId && PAIR_BY[lvId]) pairLvId=lvId;
  const lv=pairLv();
  lastSetup={mode:'pair', style:pairStyle, lv:pairLvId};
  game = pairStyle==='same'
    ? {mode:'pair', style:'same', lv:lv.id, cards:pairDeck(lv), sel:-1, done:0, total:lv.pairs,
       first:0, combo:0, maxCombo:0, locked:false, t:null}
    : {mode:'pair', style:'diff', lv:lv.id, cards:diffRound(lv), qi:0, total:lv.rounds, miss:0,
       first:0, combo:0, maxCombo:0, locked:false, t:null};
  go('pair');
}
function pnote(msg, ok){
  const el=document.getElementById('pnote');
  if(!el) return;
  el.textContent=msg;
  el.classList.toggle('ok', !!ok);
}
function pairClear(){
  const g=game; if(!g || g.mode!=='pair') return;
  g.cards.forEach(c=>{ c.bad=false; });
  if(g.style==='same') g.sel=-1;
}
function pairTap(i){
  const g=game; if(!g || g.mode!=='pair' || g.locked) return;
  if(g.style==='diff') return diffTap(i);
  if(g.badT){ clearTimeout(g.badT); g.badT=null; }   /* 小孩手快：上一次配錯的收尾不要洗掉這次選的卡 */
  const c=g.cards[i]; if(!c || c.ok) return;
  g.cards.forEach(x=>{ x.bad=false; });
  if(g.sel===i){ g.sel=-1; sfx.tap(); go('pair'); return; }
  if(g.sel<0){
    g.sel=i; sfx.tap(); go('pair');
    pnote(`${c.a} × ${c.b} 是多少？再找一張答案一樣的`);
    return;
  }
  const f=g.cards[g.sel], d=ensureDaily();
  if(f.g===c.g){
    const clean = !f.tried && !c.tried;
    if(clean){
      record(f.a,f.b,true); record(c.a,c.b,true);
      g.first++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);
      d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,g.combo);
    }
    f.ok=c.ok=true; f.fresh=c.fresh=true; g.sel=-1; g.done++;
    setTimeout(()=>{ f.fresh=c.fresh=false; }, 1800);   /* 唸完口訣，卡片就消失 */
    const full=g.done>=g.total;
    if(full) g.locked=true;
    go('pair');
    pnote(`${f.a} × ${f.b} 和 ${c.a} × ${c.b} 都是 ${c.p}！`, true);
    sfx.right(g.combo);
    say(chant(f.a,f.b)+'，'+chant(c.a,c.b));
    const el=document.querySelector(`.pcard[data-arg="${i}"]`); if(el) burstAt(el, clean?14:8);
    save(); checkQuests();
    if(full) g.t=setTimeout(()=>{ if(game && game.mode==='pair') finishPair(); }, reduceMotion?400:1500);
  } else {
    f.tried=c.tried=true; f.bad=c.bad=true; g.combo=0; g.sel=-1;
    record(c.a,c.b,false);
    go('pair');
    pnote(`慢慢來，${f.a} × ${f.b} = ${f.p}，${c.a} × ${c.b} = ${c.p}，不一樣喔`);
    sfx.wrong();
    g.badT=setTimeout(()=>{
      g.badT=null;
      if(game===g && game.mode==='pair' && !game.locked && g.sel<0){ pairClear(); go('pair'); pnote('再找找看，哪兩張的答案一樣？'); }
    }, 1200);
  }
}
function diffTap(i){
  const g=game; if(!g || g.mode!=='pair' || g.style!=='diff' || g.locked) return;
  const c=g.cards[i]; if(!c || c.found) return;
  const lp=c.l[0]*c.l[1], rp=c.r[0]*c.r[1], d=ensureDaily();
  if(c.bad){
    const clean = g.miss===0;
    if(clean){
      record(c.l[0],c.l[1],true); record(c.r[0],c.r[1],true);
      g.first++; g.combo++; g.maxCombo=Math.max(g.maxCombo,g.combo);
      d.p.correct++; d.p.maxCombo=Math.max(d.p.maxCombo,g.combo);
    }
    c.found=true; g.locked=true; g.qi++;
    go('pair');
    pnote(`答對了！${c.l[0]} × ${c.l[1]} = ${lp}，但 ${c.r[0]} × ${c.r[1]} = ${rp}`);
    sfx.right(g.combo);
    say(chant(c.l[0],c.l[1])+'，'+chant(c.r[0],c.r[1]));
    save(); checkQuests();
    g.t=setTimeout(()=>{ if(game && game.mode==='pair') diffNext(); }, reduceMotion?500:1900);
  } else {
    if(g.miss===0) record(c.l[0],c.l[1],false);
    g.miss++; g.combo=0; c.tried=true;
    go('pair');
    pnote(`慢慢來，${c.l[0]} × ${c.l[1]} 和 ${c.r[0]} × ${c.r[1]} 都是 ${lp}，這兩個一樣喔`);
    sfx.wrong();
  }
}
function diffNext(){
  const g=game; if(!g || g.mode!=='pair' || g.style!=='diff') return;
  if(g.qi>=g.total) return finishPair();
  g.cards=diffRound(pairLv()); g.miss=0; g.locked=false;
  go('pair');
}
function finishPair(){
  const d=ensureDaily(), m=me(), g=game;
  const score=g.first, total=g.total, acc=score/total;
  const grade=acc>=.9?3:acc>=.7?2:1;
  d.p.rounds++; d.p.pairs++;
  if(score===total) d.p.perfect=1;
  markPlayed();
  g.result={pair:true, hard:true, style:g.style, slabel:g.style==='same'?'一次就配對成功':'一次就找到',
    score, total, grade, maxCombo:g.maxCombo, newBest:false};
  save(); checkQuests();
  go('result');
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act=el.dataset.act, arg=el.dataset.arg;
  unlockAudio();
  switch(act){
    case 'home':
      if(inGame()){ askQuit(); break; }
      closeModal(); endGame(); go('home'); break;
    case 'reviewPick': pickFor='review'; go('pick'); break;
    case 'huntPick': pickFor='hunt'; go('pick'); break;
    case 'snakePick': go('snakePick'); break;
    case 'learn': startLearn(); break;
    case 'lkey': learnKey(arg); break;
    case 'lslot': learnSlot(arg); break;
    case 'lhint': learnHint(); break;
    case 'pairPick': go('pairPick'); break;
    case 'pstyle': pairStyle = arg==='diff'?'diff':'same'; sfx.tap(); go('pairPick'); break;
    case 'plv': if(PAIR_BY[arg]) pairLvId=arg; startPair('same', pairLvId); break;
    case 'pstart': startPair(pairStyle, pairLvId); break;
    case 'ptap': pairTap(+arg); break;
    case 'snlv': snakeLvId=arg; sfx.tap(); go('snakePick'); break;
    case 'snstart': startSnake(arg==='mix'?0:+arg, snakeLvId); break;
    case 'sdir': snakeDir(arg); break;
    case 'spause': snakePause(); break;
    case 'padon': state.settings.pad=true; save(); go('snake'); break;
    case 'padoff': state.settings.pad=false; save(); go('snake'); break;
    case 'hfind': huntPick(+arg, el); break;
    case 'hhint': huntHint(); break;
    case 'gallery': closeModal(); endGame(); go('gallery'); break;
    case 'art': showArt(+arg); break;
    case 'flip': flipCard(+arg); break;
    case 'flipnone': flipAll(false); break;
    case 'auto': startAuto(); break;
    case 'input': state.settings.input=arg; save(); sfx.tap(); go(currentView); break;
    case 'start':
      if(pickFor==='hunt') startHunt(+arg); else startReview(+arg);
      break;
    case 'timed': startTimed(); break;
    case 'stages': go('stages'); break;
    case 'stage': startStage(+arg); break;
    case 'book': go('book'); break;
    case 'claim': claimQuest(arg); break;
    case 'bonus': claimBonus(arg); break;
    case 'tier': sfx.tap(); openTier(arg); break;
    case 'players': closeModal(); if(inGame()){ askQuit(); break; } endGame(); go('players'); break;
    case 'addForm': go('addPlayer'); break;
    case 'setava': {
      const m=me(), st=STICKER_BY[arg];
      if(!m || GUEST || !st || !m.owned[st.id]) break;
      m.avatar='s:'+st.id; save(); sfx.tap(); closeModal(); updateTop();
      toast(`頭像換成${st.name}了！`);
      if(currentView==='book'||currentView==='players') go(currentView);
      break;
    }
    case 'ava': formAvatar=arg; document.querySelectorAll('.ava-opt').forEach(b=>b.classList.toggle('on', b.dataset.arg===arg)); sfx.tap(); break;
    case 'guestStart': startGuest(); updateTop(); go('home'); toast('訪客模式：沒有金幣可以蒐集喔'); break;
    case 'toName': go('welcome'); break;
    case 'createPlayer': {
      const n=readName();
      if(!n){ toast('先打名字喔'); focusName(); break; }
      if(GUEST){ const g=me(); GUEST=false; g.name=n; g.avatar=avaOk(formAvatar,g.owned)?formAvatar:AVATARS[0]; save(); }
      else addPlayer(n, formAvatar);
      updateTop(); go('home');
      toast(`${n}，開始玩吧！`); sfx.fanfare();
      if(!state.settings.helped){ state.settings.helped=true; save(); setTimeout(showHelp, 900); }
      break;
    }
    case 'use': usePlayer(arg); break;
    case 'rename': askRename(arg); break;
    case 'renameOk': {
      const p=state.players.find(x=>x.id===arg), n=readName();
      if(!p) { closeModal(); break; }
      if(!n){ toast('名字不能空白喔'); focusName(); break; }
      p.name=n; p.avatar=avaOk(formAvatar,p.owned)?formAvatar:p.avatar; save(); closeModal(); updateTop(); go('players');
      break;
    }
    case 'delp': askDelete(arg); break;
    case 'delYes': removePlayer(arg); closeModal(); updateTop(); go(hasPlayer()?'players':'home'); toast('已經刪除了'); break;
    case 'key': pressKey(arg); break;
    case 'choice': submit(+arg); break;
    case 'next': advance(); break;
    case 'say': say(arg); break;
    case 'quit': askQuit(); break;
    case 'quitYes': closeModal(); endGame(); go('home'); break;
    case 'goBack': {
      const v=BACK_VIEW[arg];
      closeModal(); endGame();
      if(arg==='hunt'||arg==='review') pickFor=arg;
      go(v||'home');
      break;
    }
    case 'closeModal': closeModal(); break;
    case 'closeBook': closeModal(); if(!showUnlocked()) go('book'); break;
    case 'again': if(lastSetup){
        lastSetup.mode==='timed' ? startTimed()
        : lastSetup.mode==='hunt' ? startHunt(lastSetup.table)
        : lastSetup.mode==='snake' ? startSnake(lastSetup.table, lastSetup.lv)
        : lastSetup.mode==='learn' ? startLearn()
        : lastSetup.mode==='pair' ? startPair(lastSetup.style, lastSetup.lv)
        : startStage(lastSetup.stage);
      } break;
    case 'draw': draw(); break;
    case 'peek': { const s=STICKERS.find(x=>x.id===arg); if(s) showReveal(s,false); break; }
    case 'buddy': {
      const m=me(), s=STICKERS.find(x=>x.id===arg);
      if(!m || !s || !m.owned[s.id]) break;
      const on = m.buddy!==s.id;
      m.buddy = on ? s.id : '';
      save(); sfx.tap(); closeModal(); floatBuddy();
      toast(on ? `${s.name}出來陪你玩了！` : `${s.name}回去休息了`);
      if(currentView==='book') go('book');
      break;
    }
    case 'info': showInfo(arg); break;
    case 'mute': state.settings.muted=!state.settings.muted; save(); updateTop(); break;
    case 'zy': state.settings.zy=!ZY_ON; save(); sfx.tap(); zyApply(); updateTop(); break;
    case 'help': showHelp(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.target && e.target.id==='nameInput'){
    if(e.key==='Enter'){
      const b=document.querySelector('[data-act="renameOk"]') || document.querySelector('[data-act="createPlayer"]');
      if(b){ e.preventDefault(); b.click(); }
    }
    return;
  }
  if(e.key==='Escape' && document.getElementById('modal')){ closeModal(); return; }
  if(currentView==='snake' && game && !document.getElementById('modal')){
    unlockAudio();
    const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'}[e.key];
    if(k){ snakeDir(k); e.preventDefault(); }
    else if(e.key===' '){ snakePause(); e.preventDefault(); }
    return;
  }
  if(currentView==='learn' && game && !document.getElementById('modal')){
    unlockAudio();
    if(/^[1-9]$/.test(e.key)){ learnKey(e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ learnKey('del'); e.preventDefault(); }
    return;
  }
  if(currentView!=='play' || !game || document.getElementById('modal')) return;
  unlockAudio();
  if(game.input==='type' || game.waiting){
    if(/^[0-9]$/.test(e.key)){ pressKey(e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ pressKey('del'); e.preventDefault(); }
    else if(e.key==='Enter'){ if(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.act==='next'){ e.preventDefault(); } pressKey('ok'); e.preventDefault(); }
  }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ if(!tabStale) save(); return; }   /* 過期的分頁不要回寫 */
  if(!GUEST && !inGame() && newerSave()) adoptNewer();
});

/* 「最後更新」直接讀這個檔案的 Last-Modified，不用自己維護日期 */
(function(){
  const el=document.getElementById('upd'), d=new Date(document.lastModified);
  const z=n=>String(n).padStart(2,'0');
  if(el && !isNaN(d)) el.textContent=`／最後更新：${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())}`;
})();
ensureDaily();
const mdw=document.getElementById('meadow'); if(mdw) mdw.innerHTML=meadowHTML();
zyApply();          /* 先決定要不要注音，之後畫面一有新文字就會自動補選擇子 */
updateTop();
go('home');
initCloud();
</script>
