<!doctype html><meta charset=utf-8>
<!-- 分享預覽圖（og.png）的版型。改完用 headless Chrome 截 1200x630：
     chrome --headless --screenshot=og.png --window-size=1200,630 --hide-scrollbars og.html
     換圖之後記得把 index.html 裡 og:image / twitter:image 的 ?v= 加一號，
     不然 LINE、Facebook 會繼續拿舊的那張。 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(180deg,#DCEFFA 0%,#EFF7F0 54%,#C9DCDA 100%);
 font-family:"PingFang TC","Noto Sans TC",system-ui;display:flex;flex-direction:column;
 align-items:center;justify-content:center;position:relative}
.hill{position:absolute;left:0;bottom:0;width:1200px;height:200px}
h1{font-size:84px;margin:0;color:#3E5260;letter-spacing:2px;text-shadow:0 3px 0 rgba(255,255,255,.6)}
h2{font-size:34px;margin:14px 0 0;color:#5E7384;font-weight:600}
.row{display:flex;gap:18px;margin-top:40px;z-index:2}
.s{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
   box-shadow:0 0 0 6px #fff inset,0 6px 16px rgba(90,68,53,.18)}
.s svg{width:68px;height:68px}
.tag{margin-top:34px;font-size:26px;color:#6E8292;background:rgba(255,255,255,.72);
 padding:10px 26px;border-radius:999px;z-index:2}
</style>
